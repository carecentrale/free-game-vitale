}
const tipNoMore = () => vitalAway('OK! I will say hello another day.');
const tipNotNow = () => vitalAway('');
// "Yes" to "Do you want tips?": the tips come back from where they stopped; with every tip seen, one tip again, chosen at random
function tipYes() {
  const f = friend;
  if (!tipPanel || !f || !f.guide || f.tip !== null) return;
  if (vital.seen < VITAL_TIPS.length) { vital.ask = false; vital.skip = 0; f.tip = vital.seen; }
  else { f.tip = Math.floor(Math.random() * VITAL_TIPS.length); f.again = true; }

// The "Tips from Vital" switch in Settings. Off: he leaves at once and never comes.
function setVitalOn(on) {
  vital.on = !!on;
  vitalSave();
  if (!vital.on && friend && friend.guide) { closeTip(); removeFriend(); }
}

// ---- Quiz questions (0.6.63, SPEC-003): made at random by this code, which also works out the right answer ----
// No internet and no AI at play time. Nothing about questions or answers is stored, logged or sent: the last 10
// questions are remembered only while the game is open, so that none repeats. From 0.6.72 (SPEC-004) the questions
// follow a learning level from 1 to 100 for maths and for words.
const QUIZ_COUNT_SHAPES = { star: 'stars', heart: 'hearts', gem: 'gems', ball: 'balls', block: 'blocks' };   // pictures to count, and their names

const RACE = {

function paint(root, look) {
  const map = new Map([[SKIN, look.skin], [SKIN_DARK, look.skinDark], [HAIR, look.hair], [SHIRT, look.shirt], [PANTS, look.pants]]);
  root.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.color) return;
    const to = map.get(o.material.color.getHex());
    if (to !== undefined) o.material.color.setHex(to);
  });

const others = new Map(); // player id -> { g, name, x, y, z, yaw, legL, legR, walk }
function nameTag(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, 256, 64);
  g.fillStyle = '#fff'; g.font = 'bold 28px sans-serif'; g.textAlign = 'center';
  g.fillText(String(text).slice(0, 20), 128, 42);

  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  s.scale.set(1.6, 0.4, 1);
  s.position.y = 2.2;
  return s;
}
function makeOther(id, meta) {
  const g = TEMPLATE.clone(true);
  g.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  for (const n of ['pick', 'sword', 'held']) { const x = g.getObjectByName(n); if (x) x.visible = false; }
  paint(g, lookOf(meta));
  g.add(nameTag(safeName(meta.name)));
  scene.add(g);
  return { g, name: safeName(meta.name), x: meta.x, y: meta.y, z: meta.z, yaw: meta.yaw, legL: g.getObjectByName('legL'), legR: g.getObjectByName('legR'), walk: 0 };
}
function updateOthers(dt) {
  for (const o of others.values()) {
    const p = o.g.position;
    const dx = o.x - p.x, dy = o.y - p.y, dz = o.z - p.z;
    if (Math.hypot(dx, dy, dz) > 10) { p.set(o.x, o.y, o.z); }   // jumped far: snap
    else { const a = ease(OTHERS_RATE, dt); p.x += dx * a; p.y += dy * a; p.z += dz * a; }
    const moving = Math.hypot(dx, dz) > 0.02;
    o.walk += dt * (moving ? 9 : 0);
    const sw = Math.sin(o.walk) * 0.8;
    if (o.legL) o.legL.rotation.x = sw;
    if (o.legR) o.legR.rotation.x = -sw;
    o.g.rotation.y = o.yaw;

// ---- A shared world is the same for every player (0.6.81, SPEC-024) ----
// Before, a shared world shared only the blocks and where the players were. Now one device leads the world: the first
// player in it (the earliest to join, by the time it joined). It moves the monsters, the merchant carts and their guards,
// decides fights, gives out what is dropped, and picks when a dragon comes down to eat; it sends that over the world's live
// channel, at most about 3 times a second. The others draw what it sends. Villagers and dragons' flights are worked out on
// every device from the world's seed and a shared clock (the leading device's clock, sent with each message), so they
// need no messages. When the leading device leaves or goes quiet for 4 seconds, the next player leads, with the same
// monsters and carts. A child whose connection drops plays on alone; when it comes back it is brought back in step.
// Only the state of game things is sent (places, life, who picked something up): never text, names typed by a child, or
// anything about the child. The bag, gems, gear, powers, learning level, questions and answers stay on each device.
const SYNC_MS = 330, SYNC_QUIET = 4000, SHARE_NEAR = 16, SHARE_WINDOW = 30000;
const joinedAt = Date.now();

let leaderKey = null;           // the presence key of the leading device
let wasShared = false;
const heard = new Map();        // presence key -> when its last update came (a device that goes quiet stops leading)
const sharedNow = () => Date.now() + syncClock;
// True when other players are in this shared world and the live channel is working
const sharedOn = () => !!(channel && channelJoined && others.size > 0);
const isLeader = () => !sharedOn() || leaderKey === pid;
const sharedLead = () => sharedOn() && leaderKey === pid;
function chooseLeader() {
  const st = channel ? channel.presenceState() : {}, now = Date.now();
  const list = [[joinedAt, pid]];
  for (const key of Object.keys(st)) {
    if (key === pid) continue;
    const metas = st[key], m = metas && metas[metas.length - 1];
    if (!m || !Number.isFinite(m.since)) continue;
    if (now - (heard.get(key) || 0) > SYNC_QUIET) continue;   // gone quiet: it does not lead
    list.push([m.since, key]);

  list.sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : 1));

}
function onLeaderChange(before) {
  if (leaderKey === pid) {

    for (const en of enemies) en.mirror = false;
    for (const m of merchants.values()) { m.mirror = false; m.shared = false; }
    syncClock = 0;
  } else if (before === pid || before === null) {
    // another device leads: its monsters replace this device's own, and this device's drops go to it
    for (const en of [...enemies]) if (!en.mirror) { scene.remove(en.group); enemies.splice(enemies.indexOf(en), 1); }
    sendSync('drops', { d: [...drops.values()].filter(d => !d.guard).map(d => [d.x, d.y, d.z, d.id, d.at]) });
    sendSync('snapreq', {});

}
function sendSync(event, payload) {

}
// Whoever is near: this child and the others in the world, [{ key, x, z }]
function playersHere() {

}
const nearestPlayer = (x, z) => playersHere().reduce((b, p) => Math.min(b, Math.hypot(p.x - x, p.z - z)), Infinity);
// The leading device's message: monsters [id, kind, x, y, z, yaw, hp] and carts [key, s, dir, wait, stopped, fighting]
function syncTick() {

      for (const en of enemies) en.mirror = false;
      for (const m of merchants.values()) { m.mirror = false; m.shared = false; }
    }
    return;
  }
  wasShared = true;
  chooseLeader();
  if (!sharedLead()) return;
  const r1 = v => Math.round(v * 10) / 10;
  const mons = enemies.filter(en => !en.mirror).map(en => [en.id, en.kind, r1(en.x), r1(en.y), r1(en.z), Math.round(en.group.rotation.y * 100) / 100, en.hp]);

setInterval(() => { try { syncTick(); } catch (e) { logError(e, 'sync'); } }, SYNC_MS);
// A message from the leading device: this device draws its monsters and carts
function onWorldState(p, from) {

function mirrorCart(key) {

    const moving = Math.hypot(en.tx - en.x, en.tz - en.z) > 0.05;

// The quiz friends and Vital of the other children: seen by everyone, in the same place. Tapping another child's quiz

const friendMirrors = new Map();   // presence key -> { kind, group, x, y, z, yaw }
function updateFriendMirrors(dt) {
  const st = channel ? channel.presenceState() : {}, seen = new Set();
  for (const [key] of others) {
    const metas = st[key], m = metas && metas[metas.length - 1];
    const f = m && Array.isArray(m.f) && m.f.length >= 5 && (m.f[0] === 'vital' || FRIEND_KINDS.includes(m.f[0])) && [1, 2, 3, 4].every(i => Number.isFinite(m.f[i])) ? m.f : null;
    if (!f) continue;
    seen.add(key);
    let o = friendMirrors.get(key);
    if (o && o.kind !== f[0]) { scene.remove(o.group); o = null; }
    if (!o) { const group = friendModel(f[0]); scene.add(group); o = { kind: f[0], group, x: f[1], y: f[2], z: f[3], yaw: f[4] }; friendMirrors.set(key, o); }
    const a = Math.min(1, dt * 8);
    o.x += (f[1] - o.x) * a; o.y += (f[2] - o.y) * a; o.z += (f[3] - o.z) * a; o.yaw += angDiff(f[4], o.yaw) * a;
    o.group.position.set(o.x, o.y, o.z);
    o.group.rotation.y = o.yaw;
    // this child's own copy of the same friend stands in the same place: the other one is not drawn twice
    o.group.visible = !(friend && friend.kind === o.kind && Math.hypot(friend.x - o.x, friend.z - o.z) < 1.5);

    if (o.kind === 'vital' || !o.group.visible) continue;
    const mid = new THREE.Vector3(o.x, o.y + 0.6, o.z), c = mid.clone().project(camera);
    if (c.z >= 1) continue;
    const sx = (c.x + 1) / 2 * innerWidth, sy = (1 - c.y) / 2 * innerHeight;
    const r = Math.max(44, 0.9 * (innerHeight / 2 / Math.tan(camera.fov * Math.PI / 360)) / camera.position.distanceTo(mid));
    if (Math.hypot(x - sx, y - sy) > r) continue;
    const group = friendModel(o.kind);
    group.position.set(o.x, o.y, o.z);
    scene.add(group);

}

// fresh: joined from the start wizard. The character was standing in a world made for a new game, so it starts at the
// start point of the joined world. Otherwise (a saved game reopening its shared world) it stays where it was, unless
// the land loaded from the server is in the way (0.6.86: children were starting inside the ground).
async function joinExisting(code, fresh = false) {
  await sbReady;
  if (!sb) throw new Error('offline');
  const { data, error } = await sb.rpc('world_get', { p_code: code }).maybeSingle();
  if (error) throw error;
  if (!data) return false;
  if (data.grid) { loadShared(data.grid, code); dirty = true; }
  lastStamp = data.updated_at;
  worldId = code;
  placeSafely(fresh);
  return true;
}
async function createWorld() {
  await sbReady;
  if (!sb) throw new Error('offline');
  const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  for (let i = 0; i < 8; i++) {
    let code = '';
    for (let k = 0; k < 4; k++) code += ALPH[Math.floor(Math.random() * ALPH.length)];
    const { data: made, error } = await sb.rpc('world_create', { p_code: code, p_grid: JSON.stringify(encodeWorld()) });
    if (!error && made === true) { worldId = code; lastStamp = null; return code; }
  }
  throw new Error('Could not make a world code. Try again.');
}
async function resumeWorld(id) {
  try {
    await sbReady;
    if (!sb) return;
    const ok = await joinExisting(id);
    if (ok) { connectWorld(); logEvent('world_joined', 'resume'); }
    else { worldId = null; say('That world is gone. Start a new world from the Bag.', 5000); }
  } catch (e) { logError(e, 'resume'); }
}

// ---- Getting the new version (0.6.80, SPEC-019): Google Play's in-app update, in the Android app only ----
// The game asks Google Play when it opens and each time it comes back from the background. A new version that has waited
// fewer days than the owner's limit (admin page, game_settings force_update_days, 30 to start) is offered on Google's small
// window and downloads while the child plays; "Restart to get the new version" then saves and installs it. Past the limit,
// Google's full-screen page shows before play, after a save. Nothing about the player is sent: only the setting is read.
// The website game, and an app not installed from Google Play, show nothing and log nothing.
const UPD_DAYS_START = 30;

const UPD = { AVAILABLE: 2, IN_PROGRESS: 3, NOT_AVAILABLE: 1, DOWNLOADED: 11, OK: 0 };
const upd = {
  days: (() => { try { const r = localStorage.getItem('kidsgame.forceUpdateDays'); return r !== null && updDaysOk(+r) ? +r : UPD_DAYS_START; } catch (e) { return UPD_DAYS_START; } })(),
  line: '',            // Settings: '' (cannot be checked), 'Up to date' or 'New version ready'
  want: null,          // what waits for a safe moment: 'flex' (Google's small window), 'force' (Google's full-screen page)
  downloaded: false,   // the new version is downloaded and waits for a restart
  restartLabel: 'Restart to get the new version',
  blocked: false,      // "A new version is needed" is on screen
  checking: false, listening: false, offeredFlex: false, busy: false,
  plugin: null,        // the automated tests put a pretend Google Play here

fetch(SB_URL + '/rest/v1/game_settings?key=eq.force_update_days&select=value', { headers: { apikey: SB_KEY } })
  .then(r => r.ok ? r.json() : null)
  .then(rows => {
    const d = rows && rows[0] && rows[0].value;
    if (!updDaysOk(d)) return;
    upd.days = d;
    try { localStorage.setItem('kidsgame.forceUpdateDays', String(d)); } catch (e) {}
  })
  .catch(() => {});
function updPlugin() {
  if (upd.plugin) return upd.plugin;
  const C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform() || (C.getPlatform && C.getPlatform() !== 'android')) return null;
  if (C.isPluginAvailable && !C.isPluginAvailable('AppUpdate')) return null;
  return C.Plugins && C.Plugins.AppUpdate ? C.Plugins.AppUpdate : null;
}

function updForced(info) {
  if (info.immediateUpdateAllowed === false) return false;
  if (upd.days === 0) return true;

}

function updSafe() {
  const parent = document.getElementById('parentArea');
  if (settingsOpen || bagOpen || powersOpen || quitOpen || tradePanel || quizPanel || tipPanel) return false;
  if (parent && parent.style.display !== 'none' && parent.style.display !== '') return false;
  if (Date.now() - lastFightAt < 5000) return false;
  return true;
}
async function updCheck() {
  const p = updPlugin();
  if (!p || upd.checking || upd.busy) return;
  upd.checking = true;
  try {
    const info = await updWait(p.getAppUpdateInfo(), 5000);
    if (!info) return;
    if (info.updateAvailability === UPD.NOT_AVAILABLE) { upd.line = 'Up to date'; upd.want = null; return; }
    if (info.updateAvailability !== UPD.AVAILABLE && info.updateAvailability !== UPD.IN_PROGRESS && info.installStatus !== UPD.DOWNLOADED) return;
    upd.line = 'New version ready';
    if (upd.blocked) return;                       // the "new version is needed" screen stays; Google's page is not reopened by itself
    if (updForced(info)) { upd.want = 'force'; return; }
    if (info.installStatus === UPD.DOWNLOADED) { upd.downloaded = true; return; }
    if (info.updateAvailability === UPD.AVAILABLE && !upd.offeredFlex && info.flexibleUpdateAllowed !== false) upd.want = 'flex';
  } catch (e) {
    // no internet, Google Play not answering within 5 seconds, or not installed from Google Play: play on, check next time
  } finally { upd.checking = false; }

  saveGame();
  let ok = false;
