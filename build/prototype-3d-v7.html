<script type="module">
import * as THREE from 'three';

// ---- World settings ----
const W = 40, H = 24, D = 40, SURF = 12;
const T = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, GEM: 4 };
const SPEED = 5, GRAV = 25, JUMP = 8, HW = 0.3, HH = 1.6, REACH = 7;
const LABEL = { dig: 'Digging', build: 'Building', inv: 'Inventory', fight: 'Fighting' };
const BAR = { dig: '#ffb347', build: '#66ccff', inv: '#9cff6b', fight: '#ff6b6b' };

// ---- Items ----
const ITEMS = {
  dirt:  { name: 'Dirt',    kind: 'block',  color: 0x8d5524, block: T.DIRT },
  stone: { name: 'Stone',   kind: 'block',  color: 0x7a7a7a, block: T.STONE },
  gem:   { name: 'Gem',     kind: 'gem',    color: 0x29d3ff },
  pick:  { name: 'Pickaxe', kind: 'tool',   color: 0xb0b0b0 },
  sword: { name: 'Sword',   kind: 'weapon', color: 0xdfe6ee },
};
const hex = n => '#' + n.toString(16).padStart(6, '0');

// Items in the bag (picks and swords start in the bag)
const inv = { dirt: 0, stone: 0, gem: 0, pick: 1, sword: 1 };
let recent = ['pick', 'sword'];           // most recent first
const qb = ['pick', 'sword', null, null, null, null]; // 6 quick bar slots
let sel = 0;                              // selected quick bar slot
const held = () => qb[sel];
const invTotal = () => Object.values(inv).reduce((a, b) => a + b, 0);

const grid = new Uint8Array(W * H * D);
const idx = (x, y, z) => (y * D + z) * W + x;
const inBounds = (x, y, z) => x >= 0 && x < W && y >= 0 && y < H && z >= 0 && z < D;
// Out of the sides or below = solid wall. Above the world = open sky.
function get(x, y, z) {
  if (x < 0 || x >= W || z < 0 || z >= D || y < 0) return T.STONE;
  if (y >= H) return T.AIR;
  return grid[idx(x, y, z)];
}

// ---- Terrain generation ----
function gen(seed) {
  let s = seed;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const p = [r() * 6, r() * 6, r() * 6];
  const hgt = (x, z) => Math.round(SURF + Math.sin(x * 0.15 + p[0]) * 2 + Math.cos(z * 0.18 + p[1]) * 2 + Math.sin((x + z) * 0.1 + p[2]) * 1.5);
  for (let x = 0; x < W; x++) for (let z = 0; z < D; z++) {
    const top = hgt(x, z);
    for (let y = 0; y < H; y++) {
      let t = T.AIR;
      if (y === top) t = T.GRASS;
      else if (y < top && y >= top - 2) t = T.DIRT;
      else if (y < top - 2) t = T.STONE;
      grid[idx(x, y, z)] = t;
    }
  }
  // Caves and gems underground
  for (let x = 0; x < W; x++) for (let z = 0; z < D; z++) for (let y = 1; y < H - 4; y++) {
    const i = idx(x, y, z);
    if (grid[i] === T.STONE) {
      const n = Math.sin(x * 0.3 + y * 0.5) * Math.cos(z * 0.3 - y * 0.4) + Math.sin(z * 0.25 + x * 0.1) * 0.4;
      if (n > 0.85) grid[i] = T.AIR;
      else if (r() < 0.03) grid[i] = T.GEM;
    }
  }
}
// ---- Saving: the character and the world are kept on this device (no accounts, no personal data) ----
const SAVE_KEY = 'kidsgame.save.v1';
let wiping = false;
function readSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
function bytesToB64(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
function loadWorld(b64) {
  try {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    if (bytes.length === grid.length) { grid.set(bytes); return true; }
  } catch (e) {}
  return false;
}
function saveGame() {
  if (wiping) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, name: playerName, profile, worldId, inv, qb, recent, sel, pw,
      pos: [px, py, pz], yaw: camYaw, world: bytesToB64(grid)
    }));
  } catch (e) {}
}

const saved = readSave();
const worldLoaded = !!(saved && typeof saved.world === 'string' && loadWorld(saved.world));
if (!worldLoaded) gen(Math.floor(Math.random() * 1000000) + 1);

// ---- Textures: small pixel-art textures made in code ----
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
function shade(hexN, v) {
  return `rgb(${clamp((hexN >> 16 & 255) + v * 255)},${clamp((hexN >> 8 & 255) + v * 255)},${clamp((hexN & 255) + v * 255)})`;
}
function makeTex(draw) {
  const S = 16;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  draw(g, S);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function noise(g, S, base, amt) {
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    g.fillStyle = shade(base, rnd(-amt, amt));
    g.fillRect(x, y, 1, 1);
  }
}
const texGrassTop = makeTex((g, S) => noise(g, S, 0x5fb83a, 0.07));
const texDirt = makeTex((g, S) => noise(g, S, 0x8d5524, 0.09));
const texGrassSide = makeTex((g, S) => {
  noise(g, S, 0x8d5524, 0.09);
  for (let y = 0; y < 4; y++) for (let x = 0; x < S; x++) {
    g.fillStyle = shade(0x4caf50, rnd(-0.06, 0.06) + (y === 3 && Math.random() < 0.5 ? -0.1 : 0));
    g.fillRect(x, y, 1, 1);
  }
});
const texStone = makeTex((g, S) => {
  noise(g, S, 0x7a7a7a, 0.11);
  g.strokeStyle = shade(0x4a4a4a, 0);
  for (let i = 0; i < 4; i++) {
    g.beginPath();
    g.moveTo(rnd(0, S), rnd(0, S));
    g.lineTo(rnd(0, S), rnd(0, S));
    g.stroke();
  }
});
const texGem = makeTex((g, S) => {
  noise(g, S, 0x7a7a7a, 0.1);
  for (let i = 0; i < 7; i++) {
    g.fillStyle = Math.random() < 0.5 ? shade(0x29d3ff, 0) : shade(0xbff3ff, 0);
    g.fillRect(Math.floor(rnd(0, S - 2)), Math.floor(rnd(0, S - 2)), 2, 2);
  }
});

const mapMat = map => new THREE.MeshLambertMaterial({ map });
// Six faces per block: +x, -x, +y (top), -y (bottom), +z, -z
const blockMats = {
  [T.GRASS]: [mapMat(texGrassSide), mapMat(texGrassSide), mapMat(texGrassTop), mapMat(texDirt), mapMat(texGrassSide), mapMat(texGrassSide)],
  [T.DIRT]: Array(6).fill(0).map(() => mapMat(texDirt)),
  [T.STONE]: Array(6).fill(0).map(() => mapMat(texStone)),
  [T.GEM]: Array(6).fill(0).map(() => mapMat(texGem)),
};

// ---- Three.js scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xbfe6ff, 0x5a4a3a, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.9);
sun.position.set(30, 50, 20);
scene.add(sun);

// One instanced mesh per block type (fast: many blocks, few draw calls)
const dummy = new THREE.Object3D();
const N = W * H * D;
const meshes = {};
for (const k of [T.GRASS, T.DIRT, T.STONE, T.GEM]) {
  const m = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), blockMats[k], N);
  m.count = 0;
  scene.add(m);
  meshes[k] = m;
}
let dirty = true;
function rebuild() {
  const cnt = { 1: 0, 2: 0, 3: 0, 4: 0 };
  for (let y = 0; y < H; y++) for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const t = grid[idx(x, y, z)];
    if (!t) continue;
    dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
    dummy.updateMatrix();
    meshes[t].setMatrixAt(cnt[t]++, dummy.matrix);
  }
  for (const k in meshes) {
    meshes[k].count = cnt[k];
    meshes[k].instanceMatrix.needsUpdate = true;
    meshes[k].boundingSphere = null;
  }
}

// Crack overlay that darkens the block being dug
const crack = new THREE.Mesh(new THREE.BoxGeometry(1.03, 1.03, 1.03),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false }));
crack.visible = false;
scene.add(crack);

// ---- Character: head, hair, face, body, arms, legs, held items ----
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0 });
const SKIN = 0xf1c39a, SKIN_DARK = 0xd9a77e, SHIRT = 0x3a7bd5, PANTS = 0x333b6e, SHOE = 0x3b2a1e, HAIR = 0x4a2c17, BELT = 0x5a3a20;
function part(w, h, d, c, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
  m.position.set(x, y, z);
  return m;
}
// A limb pivots at its top (shoulder or hip), so it swings like a real arm or leg
function limb(w, h, d, c, x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(w / 2, h - w, 6, 12), mat(c));
  m.position.set(0, -h / 2, 0);
  m.scale.set(1, 1, d / w);
  g.add(m);
  return g;
}

const avatar = new THREE.Group();
// Rounded shapes for the character: a soft-shaped helper keeps the same colours and pivots
function soft(geo, c, x, y, z, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, mat(c));
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  return m;
}
avatar.add(soft(new THREE.CapsuleGeometry(0.2, 0.3, 6, 14), SHIRT, 0, 1.0, 0, 1.25, 1, 0.8));
avatar.add(part(0.52, 0.08, 0.32, BELT, 0, 0.72, 0));
avatar.add(part(0.1, 0.1, 0.02, 0xc9a23a, 0, 0.72, 0.17));
avatar.add(part(0.18, 0.1, 0.18, SKIN_DARK, 0, 1.36, 0));
avatar.add(soft(new THREE.SphereGeometry(0.23, 20, 16), SKIN, 0, 1.6, 0, 1, 1.05, 1));
avatar.add(soft(new THREE.SphereGeometry(0.05, 10, 8), SKIN_DARK, -0.23, 1.6, 0));
avatar.add(soft(new THREE.SphereGeometry(0.05, 10, 8), SKIN_DARK, 0.23, 1.6, 0));
avatar.add(soft(new THREE.SphereGeometry(0.245, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), HAIR, 0, 1.6, 0, 1, 0.95, 1));
avatar.add(part(0.44, 0.1, 0.1, HAIR, 0, 1.72, 0.19));
// Face: shiny eyes, eyebrows, rosy cheeks and a smile
function tilt(m, rx, rz) { m.rotation.x = rx; m.rotation.z = rz; return m; }
for (const sx of [-1, 1]) {
  avatar.add(soft(new THREE.SphereGeometry(0.065, 14, 10), 0xffffff, sx * 0.1, 1.62, 0.19, 1, 1.1, 0.6));  // eye white
  avatar.add(soft(new THREE.SphereGeometry(0.036, 12, 10), 0x1a1a1a, sx * 0.1, 1.62, 0.225, 1, 1, 0.5));  // pupil
  avatar.add(soft(new THREE.SphereGeometry(0.013, 8, 6), 0xffffff, sx * 0.112, 1.64, 0.245));            // eye shine
  avatar.add(tilt(soft(new THREE.CapsuleGeometry(0.012, 0.09, 4, 8), HAIR, sx * 0.1, 1.71, 0.2), 0, Math.PI / 2)); // eyebrow
  avatar.add(soft(new THREE.SphereGeometry(0.035, 10, 8), 0xf08a8a, sx * 0.15, 1.5, 0.19, 1, 0.6, 0.4));  // rosy cheek
}
avatar.add(part(0.06, 0.1, 0.05, SKIN_DARK, 0, 1.56, 0.23));                                             // nose
avatar.add(tilt(soft(new THREE.TorusGeometry(0.05, 0.012, 8, 16, Math.PI), 0x8a3b3b, 0, 1.47, 0.21), 0, Math.PI)); // smile
// Shirt details: collar and a pocket
avatar.add(tilt(soft(new THREE.TorusGeometry(0.13, 0.03, 8, 20), SHIRT, 0, 1.33, 0, 1, 1, 0.8), Math.PI / 2, 0));
avatar.add(part(0.12, 0.12, 0.03, 0x2f66b8, 0.1, 1.0, 0.17));
// Curly hair volume: small curls around the head
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  avatar.add(soft(new THREE.SphereGeometry(0.07, 10, 8), HAIR, Math.cos(a) * 0.25, 1.66 + Math.sin(i * 1.7) * 0.06, Math.sin(a) * 0.23 - 0.02));
}
// Necklace of beads on a curved cord
avatar.add(tilt(soft(new THREE.TorusGeometry(0.11, 0.01, 8, 20, Math.PI), 0xc9a23a, 0, 1.34, 0.12), 0, Math.PI));
for (let i = 0; i < 5; i++) {
  const a = Math.PI * (0.1 + i * 0.2);
  avatar.add(soft(new THREE.SphereGeometry(0.018, 8, 6), 0xf5d06b, Math.cos(a) * 0.11, 1.34 - Math.sin(a) * 0.11, 0.13));
}
// Patterned sash across the shirt
avatar.add(part(0.52, 0.035, 0.03, 0xf2c94c, 0, 0.88, 0.17));
avatar.add(part(0.52, 0.035, 0.03, 0xe05a4a, 0, 0.83, 0.17));


// Move the head parts into a group that turns on its own
const headGroup = new THREE.Group();
avatar.add(headGroup);
for (const c of [...avatar.children]) if (c.position.y >= 1.44) headGroup.add(c);

const legL = limb(0.2, 0.7, 0.2, PANTS, -0.13, 0.7, 0);
const legR = limb(0.2, 0.7, 0.2, PANTS, 0.13, 0.7, 0);
legL.add(soft(new THREE.SphereGeometry(0.12, 14, 10), SHOE, 0, -0.72, 0.05, 1, 0.6, 1.4));
legR.add(soft(new THREE.SphereGeometry(0.12, 14, 10), SHOE, 0, -0.72, 0.05, 1, 0.6, 1.4));
const armL = limb(0.16, 0.6, 0.16, SHIRT, -0.34, 1.3, 0);
const armR = limb(0.16, 0.6, 0.16, SHIRT, 0.34, 1.3, 0);
armL.add(soft(new THREE.SphereGeometry(0.075, 12, 10), SKIN, 0, -0.66, 0));
armR.add(soft(new THREE.SphereGeometry(0.075, 12, 10), SKIN, 0, -0.66, 0));
// Gold wristbands on both arms
for (const arm of [armL, armR]) arm.add(tilt(soft(new THREE.TorusGeometry(0.085, 0.018, 8, 16), 0xffd54a, 0, -0.45, 0), Math.PI / 2, 0));

// Held items: each one only shows while it is selected in the quick bar
const pickGroup = new THREE.Group();                 // pickaxe, right hand
pickGroup.add(part(0.06, 0.5, 0.06, 0x8b5a2b, 0, -0.4, 0.12));
pickGroup.add(part(0.3, 0.07, 0.07, 0x9e9e9e, 0, -0.66, 0.12));
armR.add(pickGroup);
const swordGroup = new THREE.Group();                // sword, left hand
swordGroup.add(part(0.05, 0.5, 0.05, 0xdfe6ee, 0, -0.4, 0.12));
swordGroup.add(part(0.2, 0.05, 0.06, 0x8b5a2b, 0, -0.16, 0.12));
armL.add(swordGroup);
const heldCube = part(0.22, 0.22, 0.22, 0xffffff, 0, -0.72, 0.1); // a block or gem in the right hand
armR.add(heldCube);

avatar.add(legL, legR, armL, armR);
scene.add(avatar);

// Show the right things in the hands for the selected quick bar item
function updateHand() {
  const id = held();
  const kind = id ? ITEMS[id].kind : null;
  pickGroup.visible = id === 'pick';
  swordGroup.visible = id === 'sword';

function spawnSlime() {
  for (let tries = 0; tries < 20; tries++) {
    const x = Math.floor(Math.random() * (W - 2)) + 1, z = Math.floor(Math.random() * (D - 2)) + 1;
    let y = H - 1;
    while (y > 0 && grid[idx(x, y, z)] === T.AIR) y--;
    if (grid[idx(x, y, z)] !== T.GRASS) continue;
    if (Math.hypot(x + 0.5 - px, z + 0.5 - pz) < 6) continue;
    const kind = ENEMY_LIST[Math.floor(Math.random() * ENEMY_LIST.length)];
    const group = enemyModel(kind);
    scene.add(group);
    const en = { group, kind, base: ENEMY_KINDS[kind].scale, x: x + 0.5, y: y + 1.01, z: z + 0.5, vx: 0, vy: 0, vz: 0, timer: 1, hitP: 0 };
    group.traverse(c => { c.userData.enemy = en; });

    return;
  }

for (let i = 0; i < 6; i++) spawnSlime();
let slimeSpawnT = 6;
function updateSpawns(dt) {

// Like hits(), but for any size of box
function solidBox(x, y, z, hw, hh) {
  for (const dx of [-hw, hw]) for (const dz of [-hw, hw]) for (const dy of [0.01, hh - 0.01]) {
    if (get(Math.floor(x + dx), Math.floor(y + dy), Math.floor(z + dz)) !== T.AIR) return true;
  }
  return false;
}

function updateSlimes(dt) {
  const now = performance.now() / 1000;
  for (const en of enemies) {
    en.timer -= dt;
    if (en.timer <= 0) {
      en.timer = 1.5 + Math.random() * 2.5;
      const a = Math.random() * Math.PI * 2;
      en.vx = Math.sin(a) * 1.0;
      en.vz = Math.cos(a) * 1.0;
      if (Math.random() < 0.3) { en.vx = 0; en.vz = 0; }
    }
    const nx = en.x + en.vx * dt;
    if (!solidBox(nx, en.y, en.z, 0.3, 0.8)) en.x = nx; else en.timer = 0;
    const nz = en.z + en.vz * dt;
    if (!solidBox(en.x, en.y, nz, 0.3, 0.8)) en.z = nz; else en.timer = 0;
    en.vy = Math.max(en.vy - GRAV * dt, -30);
    const ny = en.y + en.vy * dt;
    if (!solidBox(en.x, ny, en.z, 0.3, 0.8)) en.y = ny; else en.vy = 0;

    const sq = en.hitP * 0.25 + Math.sin(now * 5 + en.x) * 0.05;
    // Walk bounce and side sway while moving, slow breathing while standing
    const moving = en.vx || en.vz;
    const ph = now * 8 + en.x * 3;
    const bob = moving ? Math.abs(Math.sin(ph)) * 0.09 : Math.sin(now * 2 + en.x) * 0.02;
    en.group.position.set(en.x, en.y + bob, en.z);
    en.group.scale.set((1 + sq) * en.base, (1 - sq) * en.base, (1 + sq) * en.base);
    en.group.rotation.z = moving ? Math.sin(ph) * 0.08 : 0;
    if (moving) en.group.rotation.y = Math.atan2(en.vx, en.vz);
  }
}

// Hold on a slime with the sword selected to attack it
function updateFight(dt) {
  if (!fight) { for (const en of enemies) en.hitP = 0; return; }
  const en = fight.e;
  if (!enemies.includes(en)) { fight = null; return; }
  const dist = Math.hypot(en.x - px, en.y - py, en.z - pz);
  if (dist > REACH + 1) { fight = null; en.hitP = 0; return; }
  fight.t += dt;
  const hitTime = fightTime() * ENEMY_KINDS[en.kind].fight;
  en.hitP = Math.min(1, fight.t / hitTime);
  if (fight.t >= hitTime) { en.hitP = 0; killSlime(en); fight = null; }
}

function killSlime(en) {
  scene.remove(en.group);
  enemies.splice(enemies.indexOf(en), 1);
  const k = ENEMY_KINDS[en.kind];
  for (let i = 0; i < k.gems; i++) addItem('gem');
  gain('fight', 2);
  logEvent('enemy_defeated', en.kind);
  say(k.name + ' defeated! +' + k.gems + ' gem' + (k.gems > 1 ? 's' : ''), 1500);
}

const ray = new THREE.Raycaster();

// Which block or slime the press landed on, and the cell it would dig or build in
function aim(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...Object.values(meshes), ...enemies.map(en => en.group)], true)[0];
  if (!hit) return null;
  const enemy = hit.object.userData.enemy || null;
  const d = ray.ray.direction, p = hit.point, e2 = 0.01;
  const dig = [Math.floor(p.x + d.x * e2), Math.floor(p.y + d.y * e2), Math.floor(p.z + d.z * e2)];
  // Reach is measured from the character, not the camera (the camera is far behind)
  const dist = Math.hypot(dig[0] + 0.5 - px, dig[1] + 0.5 - (py + HH / 2), dig[2] + 0.5 - pz);
  return {
    enemy, dist, dig,
    place: [Math.floor(p.x - d.x * e2), Math.floor(p.y - d.y * e2), Math.floor(p.z - d.z * e2)]
  };
}

// Zoom: mouse wheel, or pinch with two fingers

    if (!press.moved && Math.abs(e.clientX - press.x) > 8) { press.moved = true; digging = null; fight = null; }
    if (press.moved) camYaw -= (e.clientX - press.lastX) * 0.01;

    const [a, b] = [...touches.values()];

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  setZoom(zoom * (1 + e.deltaY * 0.001));
}, { passive: false });

canvas.addEventListener('pointerdown', e => {
  if (touches.size > 1) return; // two fingers = pinch
  press = { id: e.pointerId, x: e.clientX, lastX: e.clientX, moved: false };
  pendingPlace = null;
  const a = aim(e);
  if (!a) return;
  if (a.enemy) {
    if (Math.hypot(a.enemy.x - px, a.enemy.y - py, a.enemy.z - pz) > REACH + 1) { say('Too far away! Get closer.'); return; }
    if (held() !== 'sword') { say('Select the sword in the quick bar (1-6) to fight.', 2000); return; }
    fight = { e: a.enemy, t: 0 };
    digging = null;
    return;
  }
  if (a.dist > REACH) { say('Too far away! Get closer.'); return; }
  const [dx, dy, dz] = a.dig;
  if (get(dx, dy, dz) !== T.AIR) {
    if (held() !== 'pick') { say('Select the pickaxe in the quick bar (1-6) to dig.', 2000); return; }
    digging = { x: dx, y: dy, z: dz, t: 0 };
    armSwing = 0;
  } else {
    pendingPlace = a.place; // build on release, so a drag does not build
  }
});
canvas.addEventListener('pointerup', e => {
  if (press && press.id === e.pointerId && !press.moved && pendingPlace) placeCell(...pendingPlace);
  pendingPlace = null;
  press = null;
  digging = null;
  fight = null;
});

// Keep digging progress in step with the held block; cancel if we walk away
function updateDig(dt) {
  if (!digging) { crack.visible = false; return; }
  const { x, y, z } = digging;
  const dist = Math.hypot(x + 0.5 - px, y + 0.5 - (py + HH / 2), z + 0.5 - pz);
  if (get(x, y, z) === T.AIR || dist > REACH + 1) { digging = null; crack.visible = false; return; }
  digging.t += dt;
  const progress = Math.min(1, digging.t / digTime());
  crack.visible = true;
  crack.position.set(x + 0.5, y + 0.5, z + 0.5);
  crack.material.opacity = progress * 0.6;
  if (progress >= 1) {
    const done = digCell(x, y, z);
    digging = null;
    crack.visible = false;
    if (!done) press = null;
  }
}

// ---- Game loop ----
function update(dt) {
  const k = c => !!keys[c];
  const sx = ((k('KeyD') || k('ArrowRight') || touch.R) ? 1 : 0) - ((k('KeyA') || k('ArrowLeft') || touch.L) ? 1 : 0);
  const sz = ((k('KeyS') || k('ArrowDown') || touch.B) ? 1 : 0) - ((k('KeyW') || k('ArrowUp') || touch.F) ? 1 : 0);
  const norm = Math.hypot(sx, sz) || 1;
  // Move relative to the camera, so "up" is always away from you on screen
  const cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
  const wx = sx * cosY + sz * sinY, wz = -sx * sinY + sz * cosY;
  vx = wx * SPEED / norm;
  vz = wz * SPEED / norm;

  const nx = px + vx * dt;
  if (!hits(nx, py, pz)) px = nx;
  const nz = pz + vz * dt;
  if (!hits(px, py, nz)) pz = nz;

  const jd = k('Space') || touch.J;
  if (jd && !jumpHeld && onGround) { vy = JUMP; onGround = false; squash = 1; }
  jumpHeld = jd;
  vy = Math.max(vy - GRAV * dt, -30);
  const ny = py + vy * dt;
  if (!hits(px, ny, pz)) { py = ny; onGround = false; }
  else { if (vy < 0) { onGround = true; squash = 1; } vy = 0; }

  if (py < -10) { [px, py, pz] = spawnPoint(); vy = 0; }

  // Inventory power grows while the bag is full
  if (invTotal() >= invCap()) {
    invTimer += dt;
    if (invTimer >= 1) { invTimer -= 1; gain('inv', 1); }
  } else invTimer = 0;

  updateDig(dt);
  updateFight(dt);
  updateSlimes(dt);
  updateSpawns(dt);

  const moving = sx || sz;
  if (moving) avatar.rotation.y = Math.atan2(vx, vz);
  headYaw += (headTarget - headYaw) * 0.15;
  headGroup.rotation.y = headYaw;

  walkT += dt * (moving && onGround ? 9 : 0);
  const swing = Math.sin(walkT) * 0.8;
  legL.rotation.x = swing;
  legR.rotation.x = -swing;
  armL.rotation.x = onGround ? -swing : -2.4;
  if (fight) armL.rotation.x = -1.3 + Math.sin(performance.now() / 110) * 0.8;
  if (digging) {
    armR.rotation.x = -1.3 + Math.sin(performance.now() / 110) * 0.7;
  } else if (armSwing > 0) {
    armSwing -= dt;
    armR.rotation.x = -1.2;
  } else {
    armR.rotation.x = onGround ? swing : -2.4;
  }

  squash = Math.max(0, squash - dt * 4);
  const sq = squash * 0.2;
  avatar.position.set(px, py, pz);
  avatar.scale.set(1 + sq, 1 - sq, 1 + sq);

  // Camera follows from behind, turned by camYaw, and zoomed by zoom
  const camX = px + Math.sin(camYaw) * 9 * zoom, camZ = pz + Math.cos(camYaw) * 9 * zoom;
  camera.position.lerp(new THREE.Vector3(camX, py + 5 * zoom, camZ), 0.12);
  camera.lookAt(px, py + 1, pz);

  const under = get(Math.floor(px), Math.floor(py + HH), Math.floor(pz)) !== T.AIR;
  scene.background.setHex(under ? 0x2b2238 : 0x87ceeb);

  if (msgT > 0) { msgT -= dt * 1000; if (msgT <= 0) msgEl.textContent = ''; }
  drawHud();
}

const hud = document.getElementById('hud');
function drawHud() {
  const cap = invCap(), total = invTotal();
  const bar = (k, ratio) => `<div class="bar"><div style="width:${Math.min(1, ratio) * 100}%;background:${BAR[k]}"></div></div>`;
  hud.innerHTML =
    `${playerName}<br>` +
    `Digging Lv ${pw.dig.lvl}${bar('dig', pw.dig.xp / need(pw.dig.lvl))}` +
    `Building Lv ${pw.build.lvl}${bar('build', pw.build.xp / need(pw.build.lvl))}` +
    `Inventory Lv ${pw.inv.lvl}${bar('inv', total / cap)}` +
    `Fighting Lv ${pw.fight.lvl}${bar('fight', pw.fight.xp / need(pw.fight.lvl))}` +
    `Bag ${total}/${cap} &nbsp; Gems ${inv.gem}<br>` +
    `World ${esc(worldId || 'alone')}` + (others.size ? ' &middot; With: ' + [...others.values()].map(o => esc(o.name)).join(', ') : '');
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!paused) update(dt);
  updateOthers(dt);
  if (dirty) { rebuild(); dirty = false; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
// ---- Restore the saved character, then keep saving ----
if (saved) {
  if (saved.inv) for (const k of Object.keys(inv)) if (typeof saved.inv[k] === 'number') inv[k] = saved.inv[k];
  if (Array.isArray(saved.qb)) for (let i = 0; i < qb.length; i++) qb[i] = ITEMS[saved.qb[i]] ? saved.qb[i] : null;
  if (Array.isArray(saved.recent)) recent = saved.recent.filter(r => ITEMS[r]);
  if (saved.pw) for (const k of Object.keys(pw)) if (saved.pw[k] && Number.isFinite(saved.pw[k].lvl)) pw[k] = saved.pw[k];
  if (Number.isInteger(saved.sel) && saved.sel >= 0 && saved.sel < 6) sel = saved.sel;
  if (Array.isArray(saved.pos) && saved.pos.length === 3 && !hits(...saved.pos)) [px, py, pz] = saved.pos;
  if (Number.isFinite(saved.yaw)) camYaw = saved.yaw;
  if (worldLoaded) say('Welcome back, ' + playerName + '!', 2500);
}

// ---- Item pictures, drawn in code (no downloads needed) ----
const iconCache = {};
function itemIcon(id) {
  if (iconCache[id]) return iconCache[id];
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const g = c.getContext('2d');
  const box = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  if (id === 'dirt') {
    box(0, 0, 32, 32, '#8d5524');
    for (const [x, y] of [[4, 6], [18, 4], [10, 16], [24, 18], [6, 24], [20, 27]]) box(x, y, 3, 3, '#6b3e18');
    box(12, 10, 2, 2, '#a86b35'); box(26, 10, 2, 2, '#a86b35');
  } else if (id === 'stone') {
    box(0, 0, 32, 32, '#7a7a7a'); box(0, 0, 32, 3, '#9a9a9a'); box(0, 29, 32, 3, '#5a5a5a');
    g.strokeStyle = '#4a4a4a'; g.lineWidth = 2; g.beginPath();
    g.moveTo(6, 8); g.lineTo(14, 16); g.lineTo(10, 24); g.moveTo(20, 6); g.lineTo(26, 14); g.stroke();
  } else if (id === 'gem') {
    g.fillStyle = '#29d3ff'; g.beginPath(); g.moveTo(16, 3); g.lineTo(28, 12); g.lineTo(16, 29); g.lineTo(4, 12); g.closePath(); g.fill();
    g.fillStyle = '#1a8fb8'; g.beginPath(); g.moveTo(4, 12); g.lineTo(16, 12); g.lineTo(16, 29); g.closePath(); g.fill();
    g.fillStyle = '#bff3ff'; g.beginPath(); g.moveTo(16, 3); g.lineTo(22, 12); g.lineTo(10, 12); g.closePath(); g.fill();
  } else if (id === 'pick') {
    g.lineCap = 'round';
    g.strokeStyle = '#8b5a2b'; g.lineWidth = 4; g.beginPath(); g.moveTo(8, 27); g.lineTo(22, 11); g.stroke();
    g.strokeStyle = '#9e9e9e'; g.lineWidth = 4; g.beginPath(); g.moveTo(3, 13); g.quadraticCurveTo(16, 2, 29, 13); g.stroke();
  } else if (id === 'sword') {
    g.save(); g.translate(16, 16); g.rotate(Math.PI / 4);
    box(-2, -14, 4, 19, '#dfe6ee'); box(-1, -14, 1, 19, '#ffffff');
    box(-6, 5, 12, 3, '#d4a017');
    box(-1.5, 8, 3, 8, '#8b5a2b');
    box(-2, 16, 4, 3, '#d4a017');
    g.restore();
  } else {
    box(0, 0, 32, 32, '#888888');
  }
  iconCache[id] = c.toDataURL();
  return iconCache[id];
}

// ---- Looks: race sets skin and hair, sex sets shirt and trousers ----
const RACE = {
  human: { skin: 0xf1c39a, skinDark: 0xd9a77e, hair: 0x4a2c17 },
  elf:   { skin: 0xf6e0c8, skinDark: 0xe4c6a6, hair: 0xe8d26a },
  dwarf: { skin: 0xd9a77e, skinDark: 0xbf8a5f, hair: 0xb0501e },
};
const SEXLOOK = {
  boy:  { shirt: 0x3a7bd5, pants: 0x333b6e },
  girl: { shirt: 0xd54a9c, pants: 0x4a3a6e },
};
const lookOf = p => ({ ...(RACE[p && p.race] || RACE.human), ...(SEXLOOK[p && p.sex] || SEXLOOK.boy) });
function paint(root, look) {
  const map = new Map([[SKIN, look.skin], [SKIN_DARK, look.skinDark], [HAIR, look.hair], [SHIRT, look.shirt], [PANTS, look.pants]]);
  root.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.color) return;
    const to = map.get(o.material.color.getHex());
    if (to !== undefined) o.material.color.setHex(to);
  });
}
function applyLook() { paint(avatar, lookOf(profile)); }

// Snapshot of the character, used to build the other players
pickGroup.name = 'pick'; swordGroup.name = 'sword'; heldCube.name = 'held';

// ---- Other players in the same world ----
const others = new Map(); // player id -> { g, name, x, y, z, yaw, legL, legR, walk }
function nameTag(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, 256, 64);
  g.fillStyle = '#fff'; g.font = 'bold 28px sans-serif'; g.textAlign = 'center';
  g.fillText(String(text).slice(0, 20), 128, 42);
  const t = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  s.scale.set(1.6, 0.4, 1);
  s.position.y = 2.2;
  return s;
}
function makeOther(id, meta) {
  const g = TEMPLATE.clone(true);
  g.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  for (const n of ['pick', 'sword', 'held']) { const x = g.getObjectByName(n); if (x) x.visible = false; }
  paint(g, lookOf(meta));
  g.add(nameTag(meta.name));
  scene.add(g);
  return { g, name: meta.name, x: meta.x, y: meta.y, z: meta.z, yaw: meta.yaw, legL: g.getObjectByName('legL'), legR: g.getObjectByName('legR'), walk: 0 };
}
function updateOthers(dt) {
  for (const o of others.values()) {
    const p = o.g.position;
    const dx = o.x - p.x, dy = o.y - p.y, dz = o.z - p.z;
    if (Math.hypot(dx, dy, dz) > 10) { p.set(o.x, o.y, o.z); }   // jumped far: snap
    else { p.x += dx * 0.25; p.y += dy * 0.25; p.z += dz * 0.25; }
    const moving = Math.hypot(dx, dz) > 0.02;
    o.walk += dt * (moving ? 9 : 0);
    const sw = Math.sin(o.walk) * 0.8;
    if (o.legL) o.legL.rotation.x = sw;
    if (o.legR) o.legR.rotation.x = -sw;
    o.g.rotation.y = o.yaw;
  }
}
function myMeta() {
  return { name: playerName, race: profile && profile.race, sex: profile && profile.sex, x: px, y: py, z: pz, yaw: avatar.rotation.y };
}
function onPresence() {
  if (!channel) return;
  const st = channel.presenceState();
  const seen = new Set();
  for (const key of Object.keys(st)) {
    if (key === pid) continue;
    const metas = st[key];
    const m = metas && metas[metas.length - 1];
    if (!m) continue;
    seen.add(key);
    let o = others.get(key);
    if (!o) { o = makeOther(key, m); others.set(key, o); }
    Object.assign(o, { name: m.name, x: m.x, y: m.y, z: m.z, yaw: m.yaw });
  }
  for (const [key, o] of others) if (!seen.has(key)) { scene.remove(o.g); others.delete(key); }
}

// ---- Shared world: block changes are sent live and saved every few seconds ----
function shareBlock(x, y, z, t) {
  worldDirty = true;
  if (channel && channelJoined) Promise.resolve(channel.send({ type: 'broadcast', event: 'block', payload: { x, y, z, t } })).catch(() => {});
}
function connectWorld() {
  if (!sb || !worldId) return;
  if (channel) { try { sb.removeChannel(channel); } catch (e) {} channel = null; channelJoined = false; }
  for (const o of others.values()) scene.remove(o.g);
  others.clear();
  const ch = sb.channel('world-' + worldId, { config: { presence: { key: pid }, broadcast: { self: false } } });
  ch.on('broadcast', { event: 'block' }, ({ payload }) => {
    const p = payload || {};
    if (!inBounds(p.x, p.y, p.z) || !Number.isInteger(p.t) || p.t < 0 || p.t > 4) return;
    grid[idx(p.x, p.y, p.z)] = p.t;
    dirty = true;
  });
  ch.on('presence', { event: 'sync' }, onPresence);
  ch.subscribe(status => {
    if (status === 'SUBSCRIBED') { channelJoined = true; Promise.resolve(ch.track(myMeta())).catch(() => {}); }
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { channelJoined = false; logError(status, 'realtime'); }
  });
  channel = ch;
}
setInterval(() => {
  if (channel && channelJoined && profile) Promise.resolve(channel.track(myMeta())).catch(() => {});

async function joinExisting(code) {
  await sbReady;
  if (!sb) throw new Error('offline');
  const { data, error } = await sb.from('worlds').select('grid,updated_at').eq('id', code).maybeSingle();
  if (error) throw error;
  if (!data) return false;
  if (data.grid) { loadWorld(data.grid); dirty = true; }
  lastStamp = data.updated_at;
  worldId = code;
  return true;
}
async function createWorld() {
  await sbReady;
  if (!sb) throw new Error('offline');
  const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  for (let i = 0; i < 8; i++) {
    let code = '';
    for (let k = 0; k < 4; k++) code += ALPH[Math.floor(Math.random() * ALPH.length)];
    const { error } = await sb.from('worlds').insert({ id: code, grid: bytesToB64(grid) });
    if (!error) { worldId = code; lastStamp = null; return code; }
  }
  throw new Error('Could not make a world code. Try again.');
}
async function resumeWorld(id) {
  try {
    await sbReady;
    if (!sb) return;
    const ok = await joinExisting(id);
    if (ok) { connectWorld(); logEvent('world_joined', 'resume'); }
    else { worldId = null; say('That world is gone. Start a new world from the Bag.', 5000); }
  } catch (e) { logError(e, 'resume'); }
}

  wiz.code = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  e.target.value = wiz.code;
  wizNext.disabled = !(wiz.mode === 'new' || wiz.code.length === 4);
});
wizBack.addEventListener('click', () => { if (wiz.step > 0) { wiz.step--; wizRender(); } });
wizNext.addEventListener('click', () => { if (wiz.step < 3) { wiz.step++; wizRender(); } else finishWizard(); });

function openWizard() {
  paused = true;
  wiz.step = 0;
  wiz.sex = (profile && profile.sex) || null;
  wiz.race = (profile && profile.race) || null;
  wiz.name = playerName || makeName();
  wiz.mode = 'new';
  wiz.code = '';
  wizEl.classList.remove('hide');
  wizRender();
}
async function finishWizard() {
  wizNext.disabled = true;
  wizErr.textContent = 'Setting up your world...';
  try {
    await sbReady;
    if (wiz.mode === 'new') await createWorld();
    else {
      const found = await joinExisting(wiz.code);
      if (!found) throw new Error('No world has that code. Check it with your friend.');
    }
  } catch (err) {
    wizErr.textContent = err.message === 'offline' ? "Can't reach the server right now. Try again in a moment." : err.message;
    wizNext.disabled = false;
    logError(err, 'wizard');
    return;
  }
  profile = { sex: wiz.sex, race: wiz.race };
  playerName = wiz.name;
  applyLook();
  connectWorld();
  logEvent('game_started', wiz.mode);
  wizEl.classList.add('hide');
  paused = false;
  saveGame();
  say('Welcome, ' + playerName + '! World code: ' + worldId, 6000);
}

// ---- Startup ----
applyLook();
logEvent('session_start', VERSION);
if (profile && worldId) { paused = false; resumeWorld(worldId); }
else openWizard();

setInterval(saveGame, 5000);
addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

rebuild();
dirty = false;
updateHand();
renderUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
