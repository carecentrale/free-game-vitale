<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Adventurers of Drenerics v0.6.86 (3D)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:sans-serif;touch-action:none;user-select:none}
  canvas{display:block}
  #hud{position:fixed;top:10px;left:10px;color:#fff;text-shadow:0 2px 4px #000;font-size:16px;line-height:1.4;pointer-events:none}
  .bar{width:180px;height:14px;background:rgba(0,0,0,.5);margin:4px 0}
  .bar>div{height:100%;width:0}
  #msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;text-shadow:0 2px 4px #000;pointer-events:none;white-space:nowrap}
  .btn{position:fixed;width:56px;height:50px;background:rgba(255,255,255,.3);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;touch-action:none}
  #topbar{position:fixed;top:8px;right:10px;display:flex;align-items:center;gap:8px;z-index:10}
  /* Powers button (0.6.74): a star, beside Settings. At least 44 px tall. Opens the Powers panel */
  #powersBtn{flex:none;min-width:44px;height:44px;box-sizing:border-box;padding:0 10px;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
  #powersBtn .star{color:#ffd54a;font-size:22px;line-height:1}
  /* View button (0.6.76): an eye, beside Settings. Switches between the view from behind and through the character's eyes */
  #viewBtn{flex:none;min-width:44px;height:44px;box-sizing:border-box;padding:0 8px;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
  #viewBtn svg{width:24px;height:24px;display:block}
  #viewBtn.eyes{background:rgba(59,111,216,.75)}
  #perfBox{position:fixed;left:50%;bottom:2px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#9cff6b;font:12px monospace;padding:2px 6px;border-radius:6px;pointer-events:none;z-index:60;display:none}
  #powers{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,90vw);max-height:90vh;overflow:auto;background:rgba(20,20,35,.96);color:#fff;border-radius:16px;padding:16px;display:none;z-index:30;box-sizing:border-box;font-size:20px;line-height:1.3}
  #powers .pname{font-size:22px;font-weight:700;color:#ffd54a;margin-bottom:8px}
  #powers .bar{width:100%;height:16px;margin:4px 0 12px;border-radius:6px;overflow:hidden}
  #powers .small{font-size:13px;opacity:.8;margin-top:4px}
  /* Quiz badges in Powers (0.6.79): five stars, lit when earned, each with its number of right answers */
  #powers .pbadges{margin:4px 0 12px;padding:10px;border-radius:12px;background:rgba(255,213,74,.12)}
  #powers .pbtitle{font-size:20px;font-weight:700;color:#ffd54a}
  #powers .pbrow{display:flex;justify-content:space-between;gap:4px;margin:8px 0 6px}
  #powers .pb{flex:1;text-align:center;font-size:14px;font-weight:700}
  #powers .pb svg{width:44px;height:44px;display:block;margin:0 auto 2px}
  #powers .pb.off{opacity:.4}
  #powers .pbnext{font-size:15px}
  #powersClose{display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:#3b6fd8;color:#fff}
  /* The Recent list is taken off the screen when fewer than two of its rows fit between the buttons (0.6.74) */
  #recent.nofit{display:none!important}
  /* The world's log (0.6.86): a speech bubble at the bottom left that lights up with a count; tap it to read the log */
  #chatBtn{position:fixed;left:16px;bottom:16px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.5);display:none;align-items:center;justify-content:center;z-index:11;cursor:pointer;touch-action:none;box-sizing:border-box}
  #chatBtn.on{display:flex}
  #chatBtn svg{width:28px;height:28px}
  #chatBtn.new{border-color:#ffd43b;animation:chatGlow 1.2s ease-in-out infinite}
  @keyframes chatGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,212,59,.9)}50%{box-shadow:0 0 0 10px rgba(255,212,59,0)}}
  #chatCount{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#d9473b;color:#fff;font:bold 13px sans-serif;display:none;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}
  #chatBtn.new #chatCount{display:flex}
  #chatPeek{position:fixed;left:78px;bottom:26px;max-width:min(60vw,340px);background:rgba(0,0,0,.6);color:#fff;font-size:14px;padding:6px 10px;border-radius:10px;pointer-events:none;z-index:11;transition:opacity .6s;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chatLog{position:fixed;left:16px;bottom:80px;width:min(340px,80vw);max-height:40vh;background:rgba(10,12,25,.85);color:#fff;border-radius:12px;z-index:21;display:none;flex-direction:column;box-sizing:border-box}
  #chatLog.open{display:flex}
  #chatLog .head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #445;font-weight:700}
  #chatLog .head button{background:transparent;color:#fff;border:1px solid #556;border-radius:8px;min-height:36px;min-width:44px;font-size:16px;cursor:pointer}
  #chatLines{overflow-y:auto;padding:6px 10px 10px;font-size:14px;line-height:1.5}
  #chatLines .t{opacity:.6;font-size:12px;margin-right:6px}
  body.padon #chatBtn{bottom:calc(clamp(96px,30vmin,150px) + 28px)}
  body.padon #chatPeek{bottom:calc(clamp(96px,30vmin,150px) + 38px)}
  body.padon #chatLog{bottom:calc(clamp(96px,30vmin,150px) + 92px)}
  #mapBox{position:fixed;top:44px;left:50%;transform:translateX(-50%);width:clamp(180px,46vmin,384px);z-index:20;background:rgba(0,0,0,.55);border-radius:12px;padding:6px;cursor:pointer}
  #mapBox.hide{display:none}
  #mapBox canvas{display:block;width:100%;aspect-ratio:1;border-radius:8px}
  #mapLand{image-rendering:pixelated}
  #mapDots{position:absolute;left:6px;top:6px;width:calc(100% - 12px)!important}
  #mapBox .mapKey{color:#fff;font-size:12px;text-align:center;margin-top:4px}
  #toggle,#bagBtn,#settingsBtn,#mapBtn{padding:6px 10px;background:rgba(0,0,0,.4);color:#fff;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap}
  #bagBtn{position:fixed;right:10px;top:50px;z-index:10}
  /* Hand buttons and Spell button (touch screens): round picture buttons in a column above JUMP (0.6.60) */
  .hb{position:fixed;right:28px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.45);box-sizing:border-box;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;z-index:6}
  .hb .sw{width:30px;height:30px;border:0;border-radius:4px;pointer-events:none}
  .hb .ct{position:absolute;right:-4px;bottom:-4px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;border-radius:8px;padding:1px 5px;pointer-events:none}
  .hb.empty{background:rgba(0,0,0,.15);border-style:dashed}
  .hb.on{border-color:#ffd54a;box-shadow:0 0 10px 2px #ffd54a}
  .hb.wait{opacity:.45}
  #bH1{bottom:76px}
  #bH2{bottom:138px}
  #bSpell{bottom:200px;background:rgba(255,120,30,.55)}
  /* Volume sliders in Settings: six steps, off at the left; tap or drag (0.6.60) */
  .vol{display:flex;gap:4px;height:48px;margin-top:6px;touch-action:none;cursor:pointer}
  .vol .vs{flex:1;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:none}
  .vol .vs.on{background:#3b6fd8}
  .vol .vs.off.on{background:#8a4038}
  #quit{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,86vw);background:rgba(20,20,35,.96);color:#fff;border-radius:16px;padding:18px;display:none;z-index:30;box-sizing:border-box;text-align:center;font-size:17px}
  #quit button{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
  #quitYes{background:#d9473b;color:#fff}
  #quitNo{background:#3b6fd8;color:#fff}
  #quitLogOff{background:#e08a1e;color:#fff}
  #teleBtn{flex:none;width:36px;height:36px;border-radius:50%;background:#8e44ad;border:2px solid #d7b3ee;box-shadow:0 0 8px rgba(142,68,173,.8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;user-select:none;box-sizing:border-box}
  #teleBtn.wait{opacity:.45}
  #settings{position:fixed;left:8%;right:8%;top:6%;bottom:6%;background:rgba(20,20,35,.94);color:#fff;border-radius:16px;padding:14px;display:none;overflow:auto;z-index:21;box-sizing:border-box;font-size:15px}
  #recent{position:fixed;top:82px;right:10px;width:160px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .title{color:#fff;text-shadow:0 2px 4px #000;font-size:14px;margin-bottom:2px}
  .row{background:rgba(0,0,0,.45);color:#fff;border-radius:10px;padding:6px 8px;display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;touch-action:none}
  .sw{width:26px;height:26px;border-radius:5px;border:2px solid #000;flex:none;background-size:cover;background-repeat:no-repeat;image-rendering:pixelated}
  #qb{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
  .slot{width:70px;height:64px;background:rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.35);border-radius:10px;color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:none;position:relative;text-align:center}
  .slot.sel{border-color:#ffd54a}
  .slot .n{position:absolute;top:2px;left:5px;font-size:10px;opacity:.8}
  #bag{position:fixed;left:8%;right:8%;top:8%;bottom:20%;background:rgba(20,20,35,.92);color:#fff;border-radius:16px;padding:14px;display:none;overflow:auto;z-index:20;box-sizing:border-box}
  #bag .drop{margin-left:auto;padding:9px 12px;background:#b03a2e;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer}
  #bag .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
  /* Phones (narrow screens): quick bar sits above the controls and fits the screen width */
  @media (max-width:700px){
    #qb{bottom:190px;left:0;right:88px;transform:none;justify-content:center;gap:4px;padding:0 8px;box-sizing:border-box}
    .slot{width:calc((100vw - 60px) / 6);max-width:70px;height:52px;font-size:10px;border-width:2px}
    .slot .n{font-size:9px}
    #recent{width:130px;font-size:12px}
    #powersBtn .pl,#viewBtn .pl{display:none}
    #recent .row{font-size:12px;padding:4px 6px}
    .title{font-size:12px}
  }
  /* Analog stick for touch movement: drag the knob in any direction; further from the middle = faster */
  #stick{position:fixed;left:16px;bottom:16px;width:clamp(96px,30vmin,150px);height:clamp(96px,30vmin,150px);border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);touch-action:none;box-sizing:border-box}
  #knob{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
  /* Phone button: shows the item in hand; tap it to show the quick bar */
  #hudBtn{display:none;position:fixed;top:8px;left:8px;padding:6px 10px;background:rgba(0,0,0,.45);color:#fff;border-radius:10px;font-size:14px;align-items:center;gap:6px;z-index:10;cursor:pointer;touch-action:none;max-width:45vw;white-space:nowrap;overflow:hidden}
  /* Phones, held either way: smaller controls; the quick bar and recent list stay hidden until the button is tapped */
  body.phone #hudBtn{display:flex}
  body.phone #hud{top:46px;left:8px;font-size:12px;line-height:1.3}
  body.phone #qb,body.phone #recent{display:none}
  body.phone.panel #qb,body.phone.panel #recent{display:flex}
  body.phone #qb{bottom:10px;left:calc(clamp(96px,30vmin,150px) + 28px);right:calc(clamp(64px,20vmin,88px) + 24px);transform:none;justify-content:center;gap:4px;padding:0;box-sizing:border-box;flex-wrap:wrap}
  body.phone .slot{width:clamp(44px,13vmin,62px);height:clamp(40px,12vmin,54px);font-size:9px;border-width:2px}
  body.phone .slot .sw{width:20px;height:20px}
  body.phone #recent{top:auto;bottom:calc(clamp(40px,12vmin,54px) + 22px);right:auto;left:calc(clamp(96px,30vmin,150px) + 28px);width:auto;flex-direction:row;flex-wrap:wrap;gap:4px;max-width:55vw}
  body.phone #recent .title{width:100%;font-size:11px}
  body.phone #recent .row{font-size:11px;padding:3px 6px}
  body.phone #bJ{right:12px;bottom:14px;width:clamp(64px,20vmin,88px)!important;height:clamp(48px,15vmin,62px);font-size:15px}
  body.phone .hb{width:46px;height:46px;right:calc(12px + (clamp(64px,20vmin,88px) - 46px) / 2)}
  body.phone .hb .sw{width:26px;height:26px}
  body.phone #bH1{bottom:calc(clamp(48px,15vmin,62px) + 24px)}
  body.phone #bH2{bottom:calc(clamp(48px,15vmin,62px) + 80px)}
  body.phone #bSpell{bottom:calc(clamp(48px,15vmin,62px) + 136px)}
  body.phone #chatBtn{width:44px;height:44px;left:12px}
  body.phone #chatBtn svg{width:24px;height:24px}
  body.phone #chatPeek{left:66px;font-size:12px}
  body.phone #chatLog{max-height:45vh}
  body.phone #toggle,body.phone #bagBtn,body.phone #settingsBtn,body.phone #mapBtn{font-size:12px;padding:5px 8px}
  body.phone #topbar{gap:6px;right:8px}
  body.phone #bagBtn{top:44px;right:8px}
  body.phone #teleBtn{width:30px;height:30px;font-size:15px}
  body.phone #powersBtn .pl,body.phone #viewBtn .pl{display:none}
  body.phone #toggle{max-width:72px;overflow:hidden;text-overflow:ellipsis}
  body.phone #hudBtn{max-width:calc(100vw - 300px);min-width:40px}
  body.phone #msg{font-size:15px;top:104px;white-space:normal;text-align:center;width:70vw}   /* under the name, bag and world lines, not on top of them (0.6.69) */
  #wiz{position:fixed;inset:0;background:rgba(10,12,25,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;box-sizing:border-box}
  #wiz.hide{display:none}
  #wiz .box{background:#1d2440;color:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%;box-sizing:border-box;text-align:center}
  #wiz h2{margin:0 0 8px;font-size:22px}
  #wiz p{margin:8px 0;font-size:15px;opacity:.9}
  #wiz .opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  #wiz .opt{padding:14px 18px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer}
  #wiz .opt.on{border-color:#ffd54a;background:rgba(255,213,74,.2)}
  #wiz .name{font-size:24px;font-weight:bold;margin:14px 0;color:#ffd54a}
  #wiz input{font-size:24px;letter-spacing:6px;text-align:center;width:160px;padding:8px;border-radius:10px;border:2px solid #fff;background:transparent;color:#fff;text-transform:uppercase}
  #wiz .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  #wiz .nav button{flex:1;padding:14px;border:0;border-radius:12px;font-size:17px;background:#3b6fd8;color:#fff;cursor:pointer}
  #wiz .nav button.secondary{background:transparent;border:2px solid rgba(255,255,255,.3)}
  #wiz .nav button:disabled{opacity:.4}
  #slots{position:fixed;inset:0;background:rgba(10,12,25,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;box-sizing:border-box}
  #slots.hide{display:none}
  #slots .box{background:#1d2440;color:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-sizing:border-box}
  #slots h2{margin:0 0 8px;font-size:22px;text-align:center}
  #slots p{margin:8px 0;font-size:15px;opacity:.9;text-align:center}
  #slots .savecard{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);text-align:left}
  #slots .savecard .sv-name{display:block;font-size:18px;font-weight:700}
  #slots .savecard .sv-meta{display:block;font-size:13px;opacity:.75;margin:3px 0 10px}
  #slots .savecard .sv-acts{display:flex;gap:8px}
  #slots .savecard .sv-acts button{flex:1}
  #slots .savecard .sv-acts button.sv-del{flex:0 0 auto;color:#ffb4b4;border-color:#855}
  #slots button{padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer}
  #slots button.play{background:#3b6fd8;border-color:#3b6fd8}
  #slots button:disabled{opacity:.4;cursor:default}
  #wizErr{color:#ffab9f;min-height:20px;margin-top:8px;font-size:14px}
  /* Vital's tip panel (0.6.73): one tip in large letters, a big "OK" and a smaller "No more tips" */
  #tipPanel{position:fixed;inset:0;background:rgba(10,12,25,.8);display:flex;align-items:center;justify-content:center;z-index:55;padding:8px;box-sizing:border-box}
  #tipPanel .tbox{background:#1d2440;color:#fff;border-radius:18px;padding:clamp(12px,3vmin,22px);width:min(520px,100%);max-height:100%;overflow:auto;box-sizing:border-box;text-align:center;font-family:system-ui,sans-serif}
  #tipPanel .tname{font-size:clamp(15px,3.8vmin,19px);font-weight:700;color:#ffd54a}
  #tipPanel .ttext{font-size:clamp(22px,6vmin,32px);font-weight:700;margin:8px 0 14px;line-height:1.25}
  #tipPanel button{display:block;margin:0 auto;font-family:inherit;color:#fff;cursor:pointer}
  #tipPanel .tbig{min-height:clamp(60px,15vmin,84px);width:min(320px,100%);border:3px solid rgba(255,255,255,.35);border-radius:16px;background:#2e9e4f;font-size:clamp(24px,6.5vmin,34px);font-weight:700}
  #tipPanel .tsmall{margin-top:10px;min-height:48px;min-width:160px;padding:8px 20px;border:2px solid rgba(255,255,255,.35);border-radius:12px;background:transparent;font-size:clamp(15px,4vmin,18px)}
  /* Quiz Friends question panel (0.6.63): large text, three big answer buttons and "Not now"; it fits a phone held either way */
  #quizPanel{position:fixed;inset:0;background:rgba(10,12,25,.8);display:flex;align-items:center;justify-content:center;z-index:55;padding:8px;box-sizing:border-box}
  #quizPanel .qbox{position:relative;background:#1d2440;color:#fff;border-radius:18px;padding:clamp(10px,3vmin,20px);width:min(560px,100%);max-height:100%;overflow:auto;box-sizing:border-box;text-align:center}
  #quizPanel .qtext{font-size:clamp(22px,6vmin,34px);font-weight:700}
  #quizPanel .qshow,#quizPanel .qhint{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:clamp(24px,6vmin,36px);font-weight:700}
  #quizPanel .qhint{background:rgba(255,255,255,.1);border-radius:12px;padding:8px}
  .qg{display:inline-grid;gap:3px;vertical-align:middle}
  .qd{width:18px;height:18px;border-radius:50%;background:#fff;display:block;box-sizing:border-box}
  .qd.x{background:transparent;border:2px dashed rgba(255,255,255,.55)}
  #quizPanel .qmsg{min-height:1.3em;margin-top:6px;font-size:clamp(18px,4.5vmin,24px);color:#ffd54a;font-weight:700}
  #quizPanel .qans{display:flex;gap:10px;margin-top:6px}
  #quizPanel .qa{flex:1;min-width:0;min-height:clamp(64px,17vmin,96px);border:3px solid rgba(255,255,255,.35);border-radius:16px;background:#3b6fd8;color:#fff;font-family:inherit;font-size:clamp(28px,8vmin,44px);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
  #quizPanel .qa.wob,#quizPanel .qslots.wob{animation:qwob .45s}
  /* Word scramble (0.6.65): a picture clue, the places for the letters, and the letter tiles to tap */
  #quizPanel .qclue{line-height:0;margin-top:6px}
  #quizPanel .qclue img{width:clamp(56px,17vmin,96px);height:clamp(56px,17vmin,96px);pointer-events:none}
  /* Learning level (0.6.72): the level of the question's subject, and long words (6 to 8 letters) that still fit a phone */

function faceHidden(x, y, z, t) {

function buildChunkMeshes(cx, cz) {

  const SY = CS * CS;
  const decorBins = new Map();   // one bin per model part: its geometry, material and instance matrices
  let decorCount = 0;
  for (let y = 0; y < H; y++) for (let lz = 0; lz < CS; lz++) for (let lx = 0; lx < CS; lx++) {
    const i = cellIndex(lx, y, lz);
    const t = data[i];
    if (!t) continue;
    const x = cx * CS + lx, z = cz * CS + lz;
    // Scenery stands on grass that has air above it (so digging the grass away removes its scenery when the chunk is redrawn)
    if (decorReady && (t === T.GRASS || t === T.SAND || t === T.SNOW) && y + 1 < H && data[cellIndex(lx, y + 1, lz)] === T.AIR) {

    const hidden = inside ? innerFaceHidden(data, i, t) : faceHidden(x, y, z, t);
    if (hidden) continue;
    lists[t].push(lx, y, lz);
  }
  // Blocks and scenery are placed relative to the chunk's corner, and the chunk's mesh is moved to that corner.
  // The world starts 200,000 blocks from zero, and a graphics card keeps only about 7 digits, so whole-world positions
  // were drawn in steps of up to 1/32 of a block: the ground shook as the camera moved. Small numbers are drawn exactly.
  const ox = cx * CS, oz = cz * CS;

      im.setMatrixAt(i, m4);

    im.userData.water = t === T.WATER;

  const decor = new THREE.Group();

    const im = new THREE.InstancedMesh(b.geo, b.mat, b.vals.length / 16);
    im.instanceMatrix.array.set(b.vals);
    im.instanceMatrix.needsUpdate = true;
    decor.add(im);
  }

    for (const k of [...chunkMeshes.keys()]) dropChunk(k);
    viewReset = false;
    drawnChunk = '';
  }
  if (pcx + ',' + pcz !== drawnChunk) {
    drawnChunk = pcx + ',' + pcz;
    for (const k of [...chunkMeshes.keys()]) {
      const c = chunkMeshes.get(k);
      if (Math.abs(c.cx - pcx) > VIEW || Math.abs(c.cz - pcz) > VIEW) dropChunk(k);
    }
    waiting.length = 0;
    for (let cz = pcz - VIEW; cz <= pcz + VIEW; cz++) for (let cx = pcx - VIEW; cx <= pcx + VIEW; cx++) {
      if (!chunkInPlay(cx, cz) || chunkMeshes.has(ckey(cx, cz))) continue;
      waiting.push({ cx, cz, d: (cx - pcx) ** 2 + (cz - pcz) ** 2 });
    }
    waiting.sort((a, b) => a.d - b.d);
    // Keep memory small: forget generated chunks far from the player (changed chunks are kept)
    if (chunks.size > 2000) for (const [k, c] of chunks) {
      if (!edited.has(k) && (Math.abs(c.cx - pcx) > VIEW + 3 || Math.abs(c.cz - pcz) > VIEW + 3)) chunks.delete(k);
    }

  for (const c of chunkMeshes.values()) c.decor.visible = Math.abs(c.cx - pcx) <= DECOR_NEAR && Math.abs(c.cz - pcz) <= DECOR_NEAR;

  for (const [k, c] of touched) {
    if (chunkMeshes.has(k)) dropChunk(k);

    lastDrawn += c.count;

// The top of the land near the middle of the world. Searches a small area only, so it stays fast in a huge world.
function topSpawnPoint() {
  let best = null;
  for (let dx = -12; dx <= 12; dx++) for (let dz = -12; dz <= 12; dz++) {
    const x = CENTER + dx, z = CENTER + dz;
    let y = H - 1;
    while (y > 0 && !solid(get(x, y, z))) y--;
    if (!solid(get(x, y, z))) continue;
    const d = Math.hypot(dx, dz);
    if (!best || y > best.y || (y === best.y && d < best.d)) best = { x, y, z, d };
  }
  if (!best) return [CENTER + 0.5, SURF + 3.01, CENTER + 0.5];
  return [best.x + 0.5, best.y + 3.01, best.z + 0.5];   // two blocks above the top, so the character drops onto the land
}
// After a shared world's land is loaded (0.6.86): never leave the character inside the ground.
// fresh: go to the start point of that world. Otherwise stay, or if blocks are in the way, stand on top of them.
// Returns what was done: 'ok' (nothing in the way), 'up' (moved up onto the land) or 'start' (moved to the start point).
function placeSafely(fresh) {
  if (!fresh && !hits(px, py, pz)) return 'ok';
  if (!fresh) {
    const x = Math.floor(px), z = Math.floor(pz);
    let y = H - 1;
    while (y > 0 && !solid(get(x, y, z))) y--;
    for (let up = 1.01; up <= 3.01; up += 1) if (y + up < H - 2 && !hits(px, y + up, pz)) { py = y + up; vx = vy = vz = 0; return 'up'; }
  }

  vx = vy = vz = 0;
  return 'start';
}

// Water within two blocks sideways and up to three blocks below the feet: the character is at the water's edge
function waterNear(x, y, z) {
  const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
  for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) for (let dy = -3; dy <= 1; dy++) {
    if (get(fx + dx, fy + dy, fz + dz) === T.WATER) return true;
  }
  return false;
}

const FOOT = 0.01;   // the feet and the top of the head are checked this far inside the body
function hits(x, y, z) {
  for (const dx of [-HW, HW]) for (const dz of [-HW, HW]) for (const dy of [FOOT, HH - FOOT]) {

}

// Every audio file comes from our own site (www/audio/). The list of files and their credits is www/audio/credits.json,

const AUDIO_BASE = new URL('../audio/', location.href).href;

const SOUND_KEYS = ['dig', 'place', 'gem', 'jump', 'land', 'swing', 'hit', 'defeat', 'hurt', 'fireball', 'fizzle', 'teleport', 'splash', 'break', 'tap', 'open', 'close'];

function loadAudioList() {
  if (audioListAsked) return;
  audioListAsked = true;
  const empty = { sounds: {}, music: [], credits: [] };
  fetch(AUDIO_BASE + 'credits.json').then(r => r.ok ? r.json() : null).then(j => {
    const list = { sounds: {}, music: [], credits: [] };
    for (const f of (j && Array.isArray(j.files) ? j.files : [])) {
      if (f.use === 'music') list.music.push(f.file);

      list.credits.push(String(f.credit || ''));

}

// Plays one effect. The same sound never plays more than 3 times at once. A missing or broken file is skipped quietly.
function sfx(key) {
  sfxLog.push(key);
  if (sfxLog.length > 200) sfxLog.shift();
  if (!audioStarted || audioQuit || document.hidden || !vol.sfx || !audioList) return;
  const file = audioList.sounds[key], now = performance.now();
  if (!file || now - (sfxLast[key] || 0) < 60 || sfxLive.filter(s => s.key === key).length >= 3) return;
  sfxLast[key] = now;
  try {
    const a = new Audio(AUDIO_BASE + file);
    a.volume = VOL[vol.sfx];
    const s = { key, a };
    const done = () => { const i = sfxLive.indexOf(s); if (i >= 0) sfxLive.splice(i, 1); };
    a.addEventListener('ended', done);
    a.addEventListener('error', done);
    sfxLive.push(s);
    const p = a.play();
    if (p && p.catch) p.catch(done);
  } catch (e) { /* no sound on this device: the game plays on */ }
}

// Music: one piece at a time, shuffled, never the same piece twice in a row, with a short pause in between.
// A piece is only asked for when the Music slider is on.
function startMusic() {
  clearTimeout(musicTimer);
  if (musicEl || !audioStarted || audioQuit || !audioList || !vol.music || document.hidden || !audioList.music.length || musicFails >= 3) return;
  const all = audioList.music, choices = all.length > 1 ? all.filter(f => f !== musicLast) : all;
  const file = choices[Math.floor(Math.random() * choices.length)];
  musicLast = file;
  try {
    const a = new Audio(AUDIO_BASE + file);
    a.volume = VOL[vol.music] * MUSIC_QUIETER;
    const next = failed => { if (musicEl !== a) return; musicEl = null; musicFails = failed ? musicFails + 1 : 0; musicTimer = setTimeout(startMusic, MUSIC_GAP); };
    a.addEventListener('ended', () => next(false));
    a.addEventListener('error', () => next(true));
    musicEl = a;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* no sound on this device */ }
}

  const a = musicEl;
  musicEl = null;

}

// Sets a volume slider (k is 'sfx' or 'music', step is 0 to 5) and keeps it on this device
function setVol(k, step) {
  if (!(k in vol) || !Number.isInteger(step) || step < 0 || step > 5 || vol[k] === step) return;
  vol[k] = step;
  try { localStorage.setItem('kidsgame.audio', JSON.stringify(vol)); } catch (e) {}
  if (k === 'sfx') { for (const s of sfxLive) s.a.volume = VOL[step]; sfx('gem'); }   // one sample sound, so the child hears the new level
  else if (!step) stopMusic();

}

    (i === 0 ? '&#128263;' : `<span style="display:inline-block;width:9px;height:${6 + i * 6}px;background:#fff;border-radius:2px"></span>`) + '</div>').join('') + '</div>';

  el.innerHTML = (id ? `<span class="sw" style="width:20px;height:20px;background-image:url(${itemIcon(id)})"></span>${labelOf(id)}` : 'Empty hand') +
    ` <span style="opacity:.8">${panelOpen ? '&#9650;' : '&#9660;'}</span>`;
}

// The hand buttons show quick bar slots 1 and 2: a picture, the count for a stack, and a bright ring on the item in hand
function renderHands() {
  [['bH1', 0], ['bH2', 1]].forEach(([elId, i]) => {
    const el = document.getElementById(elId), id = handItem(i);
    el.className = 'hb' + (id ? '' : ' empty') + (id && sel === i ? ' on' : '');
    el.innerHTML = id ? `<span class="sw" style="background-image:url(${itemIcon(id)})"></span>` + (ITEMS[id] ? `<span class="ct">${inv[id] || 0}</span>` : '') : '';
  });
  const sp = document.getElementById('bSpell');
  if (!sp.dataset.icon) { sp.firstChild.style.backgroundImage = `url(${itemIcon('fireball')})`; sp.dataset.icon = '1'; }
}

function renderBag() {
  const ids = [...Object.keys(ITEMS).filter(id => inv[id] > 0), ...gear.map(g => g.uid)];
  bagEl.innerHTML =
    `<div style="display:flex;justify-content:space-between;align-items:center">` +
    `<b>Bag ${invTotal()}/${invCap()}</b><span id="bagClose" style="cursor:pointer;padding:6px">Close &#10005;</span></div>` +
    `<div id="bagSlotNote" style="margin-top:8px;opacity:.85;font-size:14px">Tap an item to put it in quick bar slot ${sel + 1}.</div>` +
    `<div style="margin-top:4px;opacity:.85;font-size:14px">Bag full? Tap Drop to put one on the ground. It stays there for 5 minutes.</div>` +
    `<div class="title" style="margin-top:10px">Recent</div><div class="grid" id="bagRecent" style="margin-top:4px">` +
    (recent.filter(id => inv[id] > 0 || gearOf(id)).map(id => `<div class="row" data-item="${id}"><span class="sw" style="background-image:url(${itemIcon(id)})"></span>${labelOf(id)}</div>`).join('') ||
     '<div style="opacity:.8;font-size:14px">Nothing yet</div>') +
    `</div><div class="title" style="margin-top:12px">Everything in your bag</div>` +
    `<div class="grid" id="bagAll" style="margin-top:4px">` +
    (ids.map(id => `<div class="row" data-item="${id}"><span class="sw" style="background-image:url(${itemIcon(id)})"></span>${labelOf(id)}` +
      (canDrop(id) ? `<span class="drop" data-drop="${id}">Drop</span>` : '') + `</div>`).join('') ||
     '<div>Empty. Dig some blocks!</div>') +
    `</div>` +
    `<div style="margin-top:14px;opacity:.8"><span id="newGame" style="cursor:pointer;text-decoration:underline">Start a new game (your other saved games are kept)</span></div>`;
}

function toggleBag(force) {
  const was = bagOpen;
  bagOpen = force !== undefined ? force : !bagOpen;
  if (bagOpen !== was) sfx(bagOpen ? 'open' : 'close');
  bagEl.style.display = bagOpen ? 'block' : 'none';
  if (bagOpen) renderBag();
}

recentEl.addEventListener('click', e => {
  const r = e.target.closest('[data-item]');
  if (r) toQuick(r.dataset.item);
});
// Hold a quick bar slot (or a hand button) for half a second: the bag opens with that slot chosen, so an item can be put
// in it with one more tap (0.6.68). A short press only selects the slot, as before.
const HOLD_MS = 500;
let holdTimer = 0, holdDone = false;
function holdOpensBag(i) {
  holdDone = true;
  if (quitOpen || settingsOpen || skillPanel || quizPanel || paused) return;
  selectSlot(i);
  toggleBag(true);
}
function holdStart(i) { clearTimeout(holdTimer); holdDone = false; holdTimer = setTimeout(() => holdOpensBag(i), HOLD_MS); }
function holdEnd() { clearTimeout(holdTimer); holdTimer = 0; }
qbEl.addEventListener('pointerdown', e => { const s = e.target.closest('[data-slot]'); if (s) holdStart(+s.dataset.slot); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) qbEl.addEventListener(ev, holdEnd);
qbEl.addEventListener('click', e => {
  const s = e.target.closest('[data-slot]');
  if (!s) return;
  if (holdDone) { holdDone = false; return; }   // the press was a hold: the bag is already open for this slot
  sfx('tap');
  selectSlot(+s.dataset.slot);
  if (isPhone()) setPanel(false);   // on a phone, choosing a tool hides the bar again
});
bagEl.addEventListener('click', e => {
  if (e.target.closest('#bagClose')) return toggleBag(false);
  if (e.target.closest('#newGame')) {
    if (listSlots().length >= SLOT_MAX) { say('You have 100 saved games. Delete one the next time you open the game, then start a new one.', 5000); return; }
    if (confirm('Start a new game? Your current game stays in your saved games.')) {
      saveGame();
      setChoice('new');
      location.reload();
    }
    return;
  }
  const dr = e.target.closest('[data-drop]');
  if (dr) return dropFromBag(dr.dataset.drop);
  const r = e.target.closest('[data-item]');
  if (r) toQuick(r.dataset.item);
});
document.getElementById('bagBtn').addEventListener('click', () => toggleBag());

// ---- Teleport to the start: free. Cast for 5 minutes, then wait 1 hour before the next one ----
const TELE_CAST = 5 * 60;                 // seconds to cast
const TELE_RECHARGE = 60 * 60 * 1000;     // ms until it can be used again
const teleBtn = document.getElementById('teleBtn');
let teleCast = -1;                        // seconds left in the cast, -1 when not casting
let teleEndAt = 0;                        // clock time (ms) when the cast finishes; keeps time while the tab is in the background
let teleReadyAt = 0;                      // time (ms) when the next teleport is ready
try { teleReadyAt = Number(localStorage.getItem('teleReadyAt')) || 0; } catch (e) {}
function fmtWait(ms) {
  const m = Math.ceil(ms / 60000);
  return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min';
}
teleBtn.addEventListener('click', () => {
  if (teleCast >= 0) { say('Casting the teleport...', 1500); return; }
  const left = teleReadyAt - Date.now();
  if (left > 0) { say('Teleport ready in ' + fmtWait(left), 2000); return; }
  teleEndAt = Date.now() + TELE_CAST * 1000;
  teleCast = TELE_CAST;
  say('Casting the teleport... ' + Math.ceil(TELE_CAST / 60) + ' minutes', 2500);
});
// Keeps the cast finishing even when the game tab is in the background (the game loop is paused then)
setInterval(() => { if (teleCast >= 0) updateTeleport(0); }, 1000);
function fmtCountdown(sec) {
  const t = Math.max(0, Math.ceil(sec));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
function updateTeleport(dt) {
  if (teleCast >= 0) {
    // Use the clock, not the frame time: the game loop pauses when the tab is in the background
    teleCast = Math.max(0, (teleEndAt - Date.now()) / 1000);
    if (teleCast <= 0) {
      teleCast = -1;
      sfx('teleport');
      // Start point, three blocks up so the character drops in safely
      [px, py, pz] = topSpawnPoint();
      vx = 0; vy = 0; vz = 0;
      teleReadyAt = Date.now() + TELE_RECHARGE;
      try { localStorage.setItem('teleReadyAt', String(teleReadyAt)); } catch (e) {}
      say('Teleported to the start', 2000);
    }
  }
  const wait = teleCast < 0 && teleReadyAt - Date.now() > 0;
  teleBtn.classList.toggle('wait', teleCast >= 0 || wait);
  teleBtn.title = teleCast >= 0 ? 'Casting...' : wait ? 'Ready in ' + fmtWait(teleReadyAt - Date.now()) : 'Teleport to the start';
  // While casting, the button counts down (m:ss) so it is clear the teleport is in progress
  const label = teleCast >= 0 ? fmtCountdown(teleCast) : '&#10022;';
  if (teleBtn.dataset.label !== label) {
    teleBtn.dataset.label = label;
    teleBtn.innerHTML = label;
    teleBtn.style.fontSize = teleCast >= 0 ? '11px' : '18px';
  }
}

// Castle blocks go into the bag as themselves (0.6.76)
const BLOCK_ITEM = { [T.CSTONE]: 'castle_stone', [T.ROOF]: 'roof_tile', [T.ROOFB]: 'roof_tile_blue', [T.WOOD]: 'wood_floor', [T.PALE]: 'pale_stone', [T.SANDST]: 'sandstone', [T.DARK]: 'dark_stone', [T.SLATE]: 'slate_roof', [T.WINDOW]: 'window', [T.IRON]: 'iron_bars', [T.COBBLE]: 'cobblestone', [T.EARTH]: 'packed_earth' };
// Finish digging the block at (x,y,z). If the bag is full, the block is dropped on the ground to pick up later.
function digCell(x, y, z) {
  const t = get(x, y, z);
  if (!solid(t)) return false;
  if (friendOn(x, y, z)) return false;   // a quiz friend cannot be dug under
  const full = invTotal() >= invCap();
  if (full && drops.size >= MAX_DROPS) { say('Too many things on the ground. Pick some up first.', 2500); return false; }
  setBlock(x, y, z, T.AIR);
  shareBlock(x, y, z, T.AIR);
  const id = (t === T.GRASS || t === T.DIRT || t === T.SAND || t === T.SNOW) ? 'dirt' : t === T.STONE ? 'stone' : BLOCK_ITEM[t] || 'gem';
  if (full) {
    putDrop(x, y, z, id);
    say(ITEMS[id].name + ' dropped on the ground. Bag is full: open the bag and tap Drop to make room.', 3500);
  } else {
    if (id === 'gem') say('+1 gem!', 1200);
    addItem(id);
  }
  sfx('dig');
  if (tplOf(held()) === 'pick') wear(held());   // digging by hand wears out no tool or weapon (0.6.74)
  gain('dig', 1);
  dirty = true;
  return true;
}

// ---- Drops: items left on the ground when the bag is full. Walk over one to pick it up when there is room. ----
// Drops are kept on this device only (they are not shared with other players yet).
const MAX_DROPS = 40;
const DROP_TIME = 5 * 60 * 1000; // a dropped item disappears 5 minutes after it was dropped
const drops = new Map();                 // "x,y,z" -> { x, y, z, id, mesh, base }
const dropGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
const dropMats = {};
function dropMat(id) {
  if (!dropMats[id]) dropMats[id] = new THREE.MeshStandardMaterial({ color: ITEMS[id].color, roughness: 0.6 });
  return dropMats[id];
}
function addDrop(x, y, z, id, at = Date.now()) {
  const key = x + ',' + y + ',' + z;
  if (drops.has(key)) return;
  const mesh = new THREE.Mesh(dropGeo, dropMat(id));
  mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
  scene.add(mesh);
  drops.set(key, { x, y, z, id, mesh, base: y + 0.5, at });
  dirty = true;
}
function removeDrop(key) {
  const d = drops.get(key);
  if (!d) return;
  scene.remove(d.mesh);
  drops.delete(key);
}
function restoreDrops(list) {
  if (!Array.isArray(list)) return;
  for (const row of list.slice(0, MAX_DROPS)) {
    // Saves from before 0.6.26 have no drop time; those drops get a fresh 5 minutes
    if (!Array.isArray(row) || (row.length !== 4 && row.length !== 5)) continue;
    const [x, y, z, id, at] = row;
    if (!ITEMS[id] || !inBounds(x, y, z) || solid(get(x, y, z))) continue;
    if (row.length === 5 && Date.now() - at >= DROP_TIME) continue; // already expired while the game was closed
    addDrop(x, y, z, id, row.length === 5 ? at : Date.now());

// Bob and spin the drops, and pick one up when the player stands next to it and the bag has room
function updateDrops(time) {
  for (const [key, d] of drops) {
    if (Date.now() - d.at >= DROP_TIME) { removeDrop(key); dirty = true; continue; } // gone after 5 minutes
    if (d.guard) { if (Date.now() >= d.gone) removeDrop(key); d.mesh.rotation.y = time * 1.5; continue; }   // a guard collects it (SPEC-021): never the child's
    d.mesh.position.y = d.base + Math.sin(time * 3 + d.x) * 0.08;
    d.mesh.rotation.y = time * 1.5;
    const near = Math.hypot(d.x + 0.5 - px, d.z + 0.5 - pz) < 1.0 && py > d.y - 1 && py < d.y + 2;
    if (!near) continue;
    if (invTotal() >= invCap()) { say('Bag is full. Open the bag and tap Drop to make room for the ' + ITEMS[d.id].name + '.', 2500); continue; }
    if (sharedOn()) {   // a shared world: the leading device says who gets it (SPEC-024)
      if (isLeader()) grantPick(key, pid);
      else if (!d.asked || Date.now() - d.asked > 1500) { d.asked = Date.now(); askPick(key); }
      continue;
    }
    addItem(d.id);
    removeDrop(key);
    say('Picked up ' + ITEMS[d.id].name + '!', 1200);
  }
}

// ---- Drop from the bag (0.6.62): makes room when the bag is full. One item goes on the ground two blocks away,
// so it is not picked straight back up; it can be picked up again for 5 minutes, like any other drop.
// Blocks and monster parts can be dropped. Gems, tools, weapons and spells cannot.
const canDrop = id => !!(ITEMS[id] && (ITEMS[id].kind === 'block' || ITEMS[id].kind === 'part') && inv[id] > 0);
function dropFromBag(id) {

  const cx = Math.floor(px), cy = Math.floor(py + 0.01), cz = Math.floor(pz);
  const ring = [[2, 0], [-2, 0], [0, 2], [0, -2], [2, 2], [-2, 2], [2, -2], [-2, -2], [2, 1], [2, -1], [-2, 1], [-2, -1], [1, 2], [-1, 2], [1, -2], [-1, -2]];
  const free = (x, y, z) => inBounds(x, y, z) && !solid(get(x, y, z)) && !drops.has(x + ',' + y + ',' + z);
  let spot = null;
  // First choice: a free cell with ground under it, at the character's height or one step up or down. Otherwise any free cell.
  for (const needGround of [true, false]) for (const dy of [0, 1, -1]) for (const [dx, dz] of ring) {
    const x = cx + dx, y = cy + dy, z = cz + dz;

  const ps = playersHere(), cap = Math.min(12, 6 + 3 * (ps.length - 1));
  if (enemies.length < cap && enemySpawnT <= 0) {
    const p = ps.reduce((b, q) => { const n = enemies.filter(en => Math.hypot(en.x - q.x, en.z - q.z) < 40).length; return !b || n < b.n ? { q, n } : b; }, null);
    spawnEnemy(undefined, p.q.key === pid ? null : p.q);
    enemySpawnT = 6 / ps.length;
  }
}

// Like hits(), but for any size of box
function solidBox(x, y, z, hw, hh) {
  for (const dx of [-hw, hw]) for (const dz of [-hw, hw]) for (const dy of [0.01, hh - 0.01]) {
    if (solid(get(Math.floor(x + dx), Math.floor(y + dy), Math.floor(z + dz)))) return true;
  }
  return false;
}

// True if there is ground under (x, z) within one block below the enemy's feet.
// Stops enemies from walking off a ledge; a one-block step down is still allowed.
function groundBelow(x, z, y) {
  const cx = Math.floor(x), cz = Math.floor(z);
  for (let by = Math.floor(y - 0.1); by >= Math.floor(y - 1.2); by--) {
    if (solid(get(cx, by, cz))) return true;
  }
  return false;
}

// ---- Life bars (0.6.64): a small bar over a monster that has been hit shows how much health it has left ----
// Green when it is healthy, yellow below 60%, red below 30%. The bar always faces the screen and goes when the monster is defeated.
const LIFE_BAR_W = 0.9, LIFE_BAR_H = 0.15;
const lifeBars = new Map();   // monster -> { sprite, cx, hp, part, color, top }
const lifeColor = part => part > 0.6 ? '#4cd964' : part > 0.3 ? '#ffd54a' : '#ff5a4a';
// How high over a monster's feet its bar floats: just above its head
const lifeTop = kind => { const k = ENEMY_KINDS[kind]; return (k.file ? k.height : k.beast ? 0.95 : 1.45) * k.scale + 0.3; };
function drawLifeBar(b, en) {
  const full = ENEMY_KINDS[en.kind].health, cx = b.cx;
  b.hp = en.hp;
  b.part = Math.max(0, Math.min(1, en.hp / full));
  b.color = lifeColor(b.part);
  cx.clearRect(0, 0, 96, 16);
  cx.fillStyle = '#10131f'; cx.fillRect(0, 0, 96, 16);              // dark frame
  cx.fillStyle = '#4a4f63'; cx.fillRect(2, 2, 92, 12);              // empty part
  cx.fillStyle = b.color; cx.fillRect(2, 2, Math.round(92 * b.part), 12);
  b.sprite.material.map.needsUpdate = true;
}
function updateLifeBars() {
  for (const [en, b] of lifeBars) {
    if (enemies.includes(en)) continue;
    scene.remove(b.sprite);
    b.sprite.material.map.dispose();
    b.sprite.material.dispose();
    lifeBars.delete(en);
  }
  for (const en of enemies) {
    let b = lifeBars.get(en);
    if (!b) {
      const c = document.createElement('canvas'); c.width = 96; c.height = 16;
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
      sprite.scale.set(LIFE_BAR_W, LIFE_BAR_H, 1);
      scene.add(sprite);
      b = { sprite, cx: c.getContext('2d'), hp: null, part: 1, color: '', top: lifeTop(en.kind) };
      lifeBars.set(en, b);
    }
    if (b.hp !== en.hp) drawLifeBar(b, en);
    b.sprite.visible = en.hp < ENEMY_KINDS[en.kind].health;   // shown only once the monster has been hit (0.6.66)
    b.sprite.position.set(en.x, en.y + b.top, en.z);
  }
}

function updateEnemies(dt) {
  const now = performance.now() / 1000;
  // Remove enemies that fell off the island, left the world, or hang in the air.
  // spawnEnemy() puts new ones on the grass.
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    if (en.mirror) continue;   // drawn from the leading device's messages (SPEC-024)
    en.airT = groundBelow(en.x, en.z, en.y) ? 0 : (en.airT || 0) + dt;
    if ((sharedOn() ? nearestPlayer(en.x, en.z) : Math.hypot(en.x - px, en.z - pz)) > 90) { scene.remove(en.group); enemies.splice(i, 1); continue; } // far from every player: leave quietly
    const why = en.y < 1 ? 'below the island'
      : !inPlay(en.x, en.z) ? 'outside the world'
      : en.airT > 3 ? 'stuck in the air' : '';
    if (why) {
      debugLog('enemy_off_map', why, en, en.x, en.y, en.z);
      scene.remove(en.group);
      enemies.splice(i, 1);
    }
  }
  for (const en of enemies) {
    if (en.mirror) continue;
    en.timer -= dt;
    if (en.timer <= 0) {
      en.timer = 1.5 + Math.random() * 2.5;
      const a = Math.random() * Math.PI * 2;
      en.vx = Math.sin(a) * 1.0;
      en.vz = Math.cos(a) * 1.0;
      if (Math.random() < 0.3) { en.vx = 0; en.vz = 0; }
    }
    const nx = en.x + en.vx * dt;
    if (!solidBox(nx, en.y, en.z, 0.3, 0.8) && groundBelow(nx, en.z, en.y)) en.x = nx; else en.timer = 0;
    const nz = en.z + en.vz * dt;
    if (!solidBox(en.x, en.y, nz, 0.3, 0.8) && groundBelow(en.x, nz, en.y)) en.z = nz; else en.timer = 0;
    en.vy = Math.max(en.vy - GRAV * dt, -30);
    const ny = en.y + en.vy * dt;
    if (!solidBox(en.x, ny, en.z, 0.3, 0.8)) en.y = ny; else en.vy = 0;

    const sq = en.hitP * 0.25 + Math.sin(now * 5 + en.x) * 0.05;
    // Walk bounce and side sway while moving, slow breathing while standing.
    // The bounce stretches the body up and down; the feet stay on the block.
    const moving = en.vx || en.vz;
    const ph = now * 8 + en.x * 3;
    const bounce = moving ? Math.abs(Math.sin(ph)) * 0.08 : Math.sin(now * 2 + en.x) * 0.02;
    en.group.position.set(en.x, en.y, en.z);
    en.group.scale.set((1 + sq - bounce * 0.5) * en.base, (1 - sq + bounce) * en.base, (1 + sq - bounce * 0.5) * en.base);
    en.group.rotation.z = moving ? Math.sin(ph) * 0.08 : 0;
    if (moving) en.group.rotation.y = Math.atan2(en.vx, en.vz);
    // Limbs: the loaded models move their bones; the monsters made in code swing their arms and legs
    const rig = en.group.userData.rig, limbs = en.group.userData.limbs;
    if (rig) poseRig(rig, !!moving, ph, now, en.hitP);
    else if (limbs) {
      const s = moving ? Math.sin(ph) : 0;
      limbs.legs.forEach((leg, i) => { leg.rotation.x = (i ? s : -s) * 0.6; });
      limbs.arms.forEach((arm, i) => { arm.rotation.x = (i ? -s : s) * 0.5; });
    }
  }
  updateLifeBars();
  updateCorpses(dt);
}

// Defeated enemies lie on the ground for CORPSE_TIME seconds, then sink into the ground
const CORPSE_TIME = 300; // 5 minutes
const CORPSE_SINK = 3;   // seconds to sink out of sight
// 0.6.85: a monster the merchant's guards defeat ("drove off") does not stay: it lies for GUARD_BODY_TIME seconds, while a
// guard collects what it dropped, then sinks like any other body. Before, guarded roads filled up with bodies for 5 minutes.
const GUARD_BODY_TIME = 3;
const corpses = [];
function updateCorpses(dt) {
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    c.t += dt;
    // After CORPSE_TIME every body sinks and disappears, even if it is still falling or hovering
    if (c.t >= CORPSE_TIME) {
      if (c.sinkY === undefined) c.sinkY = c.group.position.y;
      const s = Math.min(1, (c.t - CORPSE_TIME) / CORPSE_SINK);
      c.group.position.y = c.sinkY - s * 1.6;
      if (s >= 1) {
        scene.remove(c.group);
        corpses.splice(i, 1);
      }
      continue;
    }
    if (!c.landed) {
      c.vy = Math.max(c.vy - GRAV * dt, -30);
      const ny = c.group.position.y + c.vy * dt;
      const cy = Math.floor(ny - 0.01); // the block the body is about to enter
      if (cy < 0) {
        debugLog('corpse_void', 'fell into the void', { kind: c.kind }, c.x, ny, c.z);
        scene.remove(c.group); corpses.splice(i, 1); continue;
      }
      // Only land on blocks inside the island. Outside it, keep falling until the body leaves the map.
      const inside = inPlay(c.x, c.z);
      if (inside && solid(get(Math.floor(c.x), cy, Math.floor(c.z)))) {
        c.landed = true;
        c.restY = cy + 1 + c.lift;
        c.group.position.y = c.restY;
      } else {
        c.group.position.y = ny;
      }
      continue;
    }
    if (c.t < CORPSE_TIME) {
      // Still lying here: check the ground is still under it (a player may have dug it out).
      // If not, the body falls again.
      const below = Math.floor(c.restY - c.lift - 0.01);
      const supported = inPlay(c.x, c.z) && solid(get(Math.floor(c.x), below, Math.floor(c.z)));
      if (!supported) {
        // Record it in the enemy log: a body that was resting has lost the block under it
        debugLog('corpse_unsupported', 'ground under a resting body was dug out', { kind: c.kind }, c.x, c.restY, c.z);
        c.landed = false; c.vy = 0;
      }
      continue;
    }
  }
}

// The damage of a hit with this weapon: the Fighting level, plus the weapon's extra damage
function weaponDamage(id) {
  const d = defOf(id);
  return pw.fight.lvl + (d && d.dmg ? d.dmg - 1 : 0);
}
// Sword reach (0.6.74): a sword hits only from 2 blocks or closer. The 2 blocks are measured from the character to the
// nearest side of the monster's body, so a bigger monster can be reached from a little further away.
const SWORD_REACH = 2;
function swordGap(en) {
  const side = Math.max(0, Math.hypot(en.x - px, en.z - pz) - 0.45 * en.base);
  const up = Math.max(0, en.y - (py + HH), py - (en.y + 1.8 * en.base));
  return Math.hypot(side, up);
}
// Hold on an enemy with a weapon selected to hit it. Each hit takes off health; the enemy is defeated at 0.
function updateFight(dt) {
  if (!fight) { for (const en of enemies) en.hitP = 0; return; }
  const en = fight.e;
  if (!enemies.includes(en)) { fight = null; return; }
  if (swordGap(en) > SWORD_REACH) { fight = null; en.hitP = 0; return; }   // walked away: the hits stop
  fight.t += dt;
  const hitTime = fightTime() * ENEMY_KINDS[en.kind].fight;
  en.hitP = Math.min(1, fight.t / hitTime);
  if (fight.t >= hitTime) {
    en.hitP = 0;
    fight.t = 0;   // keep hitting while the press is held
    const weapon = fight.id;
    hurtEnemy(en, damageTo(en, weaponDamage(weapon), 'sword'));
    wear(weapon);
    if (!enemies.includes(en)) fight = null;
  }
}
// One swing of a sword that is on a hand button (quick bar slot 1 or 2) but not in the hand (0.6.60).
// It hits once and the sword wears by one. The item in the hand stays in the hand.
function swingOnce(en, weapon) {
  swingT = 0.3;
  swingCool = 0.3;
  sfx('swing');
  hurtEnemy(en, damageTo(en, weaponDamage(weapon), 'sword'));
  wear(weapon);
}
// Takes health off an enemy and says so. Defeats it when its health is gone.
let lastFightAt = 0;   // when an enemy was last hit: the update window waits until a fight is over (0.6.80)
function hurtEnemy(en, amount) {
  lastFightAt = Date.now();
  const k = ENEMY_KINDS[en.kind];
  if (sharedOn() && !isLeader()) {   // another device leads the shared world: the hit is sent there (SPEC-024)
    sendHit(en, amount);
    sfx('hit');
    say(k.name + ': hit!', 1200);
    return;
  }
  en.hp -= amount;
  if (sharedOn()) { (en.hitters = en.hitters || new Map()).set(pid, Date.now()); en.lastHitter = pid; }
  if (en.hp <= 0) { if (sharedOn()) leaderDefeat(en); else defeatEnemy(en); return; }
  sfx('hit');
  say(k.name + ': ' + en.hp + ' health left' + (k.weak.length ? ' (weak to ' + k.weak.join(', ') + ')' : ''), 2000);
}

// how: null (the child defeated it), { guard } (a merchant's guards, SPEC-021) or { shared } (a shared world, SPEC-024)
function defeatEnemy(en, how = null) {
  if (!enemies.includes(en)) return;
  enemies.splice(enemies.indexOf(en), 1);
  // Leave the body lying on its side. It is no longer an enemy, so it can't be hit.
  en.group.traverse(c => { c.userData.enemy = null; });
  en.group.userData.enemy = null;
  const turn = en.group.rotation.y;
  en.group.scale.setScalar(en.base);
  en.group.rotation.set(0, turn, -Math.PI / 2);
  // A body killed in mid-air falls until it lands on a block
  const lift = 0.25 * en.base;
  const cy = Math.floor(en.y - 0.1); // the block the body would lie on
  const onBlock = solid(get(Math.floor(en.x), cy, Math.floor(en.z)));
  // A body on a block is set exactly on top of that block. An enemy's height is a fraction
  // (it stops mid-air-gravity), so using it directly left the body hovering.
  const startY = onBlock ? cy + 1 + lift : en.y + lift;
  en.group.position.set(en.x, startY, en.z);
  const byGuards = !!(how && how.guard);
  corpses.push({ group: en.group, kind: en.kind, t: byGuards ? CORPSE_TIME - GUARD_BODY_TIME : 0, x: en.x, z: en.z, vy: 0, lift, landed: onBlock, restY: startY, guard: byGuards });
  const k = ENEMY_KINDS[en.kind];
  if (how && how.guard) { if (sharedLead()) sendSync('defeat', { id: en.id, x: en.x, y: en.y, z: en.z, s: [], guard: 1 }); guardSpoils(en, k, how); sfx('defeat'); return; }    // guards keep what it drops (SPEC-021)
  if (how && how.shared) { sharedSpoils(en, k, how); return; }                // a shared world: the gems are split (SPEC-024)
  for (let i = 0; i < k.gems; i++) addItem('gem');
  for (const p of k.parts) if (Math.random() < 0.5) addItem(p);   // parts: ears, hides, horns...
  if (Math.random() < 0.15) addGear(gearFor(k.power));              // gear: weapons and armour
  gain('fight', 2);
  sfx('defeat');
  logEvent('enemy_defeated', en.kind);
  say(k.name + ' defeated! +' + k.gems + ' gem' + (k.gems > 1 ? 's' : ''), 1500);
}

// ---- Skills and magic: at Fighting level 2 the player chooses a skill. Fireball is the first one. ----
const MAGIC_LEVEL = 2;                      // Fighting level that unlocks magic and the skill choice
const SKILLS = {
  fireball: { name: 'Fireball', desc: 'Shoot a ball of fire. It hurts the enemies it hits, more if they are weak to fire.' },
};
let skills = [];                            // skills the player has chosen
let skillPanel = null;                      // the open skill choice panel, if any
const FIRE = [
  { speed: 16, life: 1.6, size: 0.22, boom: 0.9, dmg: 4 },   // magic level 1: a small ball, a small burst
  { speed: 20, life: 2.2, size: 0.34, boom: 2.4, dmg: 6 },   // magic level 2: a bigger ball and a wider burst
];
const fireballs = [];                       // { mesh, x, y, z, vx, vy, vz, t, tier }
const blasts = [];                          // { mesh, mat, t, max }: the flash where a fireball burst
let spellCool = 0;                          // seconds until the next cast
const fireGeo = new THREE.SphereGeometry(1, 12, 10);
const fireMat = new THREE.MeshBasicMaterial({ color: 0xff7a1a });

// The direction a tap or click points at, as a ray from the camera
function viewDir(clientX, clientY) {
  ndc.x = (clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  return ray.ray.direction.clone();
}

function showSkillChoice() {
  paused = true;
  const el = document.createElement('div');
  el.id = 'skillPanel';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(10,12,25,.85);display:flex;align-items:center;justify-content:center;z-index:55;padding:16px;box-sizing:border-box';
  el.innerHTML = '<div style="background:#1d2440;color:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%;text-align:center;box-sizing:border-box">' +
    '<h2 style="margin:0 0 8px;font-size:22px">Magic unlocked!</h2>' +
    '<p style="margin:8px 0;font-size:15px;opacity:.9">Choose your first skill.</p>' +
    Object.entries(SKILLS).map(([id, sk]) =>
      `<button data-skill="${id}" style="display:block;width:100%;margin:10px 0;padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer"><b>${sk.name}</b><br><span style="font-size:14px;opacity:.85">${sk.desc}</span></button>`).join('') +
    '</div>';
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-skill]');
    if (b) chooseSkill(b.dataset.skill);
  });
  document.body.appendChild(el);
  skillPanel = el;
}
function chooseSkill(id) {
  if (!SKILLS[id] || skills.includes(id)) return;
  skills.push(id);
  // The game never changes the quick bar by itself (0.6.60): the fireball goes into an empty slot only.
  // With the on-screen controls on it needs no slot at all: the Spell button casts it.
  const empty = qb.indexOf(null);
  if (!padOn && empty >= 0) qb[empty] = id;
  if (skillPanel) { skillPanel.remove(); skillPanel = null; }
  paused = false;
  say(SKILLS[id].name + ' learned! ' + (padOn ? 'Tap the spell button, then tap where to shoot.' : empty >= 0 ? 'Select it in the quick bar. Tap to shoot, or press F.' : 'Press F to shoot.'), 4000);
  updateHand();
  renderUI();
  saveGame();
}

// Shoots a fireball from the character's chest, in direction dir (a unit vector). Level 2 magic is stronger.
function castFireball(dir, target = null) {
  if (!skills.includes('fireball') || spellCool > 0) return;
  const tier = pw.magic.lvl >= 2 ? 1 : 0;
  const s = FIRE[tier];
  const d = dir.clone().normalize();
  const mesh = new THREE.Mesh(fireGeo, fireMat);
  mesh.scale.setScalar(s.size);
  const f = { mesh, x: px, y: py + HH * 0.7, z: pz, vx: d.x * s.speed, vy: d.y * s.speed, vz: d.z * s.speed, t: 0, tier, homing: target, life: s.life + (target ? 1.5 : 0) };
  mesh.position.set(f.x, f.y, f.z);
  scene.add(mesh);
  fireballs.push(f);
  spellCool = 0.4;
  armSwing = 0.3;
  sfx('fireball');
  gain('magic', 1);
}

// The enemy whose body is under the screen point (x, y), or null. Any part of its body counts:
// the body is treated as a column about 1.8 blocks tall, and the click counts anywhere inside its outline on screen.
function enemyAt(x, y) {
  let best = null, bestD = Infinity;
  const halfH = innerHeight / 2 / Math.tan(camera.fov * Math.PI / 360);
  for (const en of enemies) {
    const mid = new THREE.Vector3(en.x, en.y + 0.6, en.z);   // the middle of the body
    const c = mid.clone().project(camera);
    if (c.z >= 1) continue;   // behind the camera
    const sx = (c.x + 1) / 2 * innerWidth, sy = (1 - c.y) / 2 * innerHeight;
    const dist = camera.position.distanceTo(mid);
    const r = Math.max(40, 1.1 * halfH / dist * en.base);   // the body's outline on screen, in pixels
    const d = Math.hypot(x - sx, y - sy);
    if (d <= r && d < bestD) { best = en; bestD = d; }
  }
  return best;
}

// Fire effect: small orange and yellow sparks that fly out and fade. Made where a fireball bursts.
const sparks = [];
function fireBurst(x, y, z, size) {
  for (let i = 0; i < 14; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: i % 2 ? 0xffc04a : 0xff5a1a, transparent: true, opacity: 1 });
    const m = new THREE.Mesh(fireGeo, mat);
    m.scale.setScalar(0.22 * Math.max(0.6, size));
    m.position.set(x, y, z);
    scene.add(m);
    const a = Math.random() * Math.PI * 2, sp = 2.5 + Math.random() * 3;
    sparks.push({ m, mat, x, y, z, vx: Math.cos(a) * sp, vy: 2 + Math.random() * 4, vz: Math.sin(a) * sp, t: 0 });
  }
}

// Steam where a fireball meets water: a few grey-white puffs that rise and fade
function steamPuff(x, y, z) {
  for (let i = 0; i < 8; i++) {
    const mat = new THREE.MeshBasicMaterial({ color: i % 2 ? 0xe6eef2 : 0xb9c7cf, transparent: true, opacity: 0.9 });
    const m = new THREE.Mesh(fireGeo, mat);
    m.scale.setScalar(0.25);
    m.position.set(x, y, z);
    scene.add(m);
    const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 0.8;
    sparks.push({ m, mat, x, y, z, vx: Math.cos(a) * sp, vy: 1.5 + Math.random() * 1.5, vz: Math.sin(a) * sp, t: 0, steam: true });
  }
}
// Casts toward the point under the screen position (x, y). Hitting an enemy makes the fireball follow it.
// Local debugging only: when on, each shot is logged to the browser console. Nothing is sent anywhere.
let fireDebug = /[?&]fireDebug=1/.test(location.search);
let lastShot = null;   // the most recent shot's numbers, for the console and tests
// The nearest point seen under the screen point, water surfaces included (for fireballs only)
function sightPoint(x, y) {
  ndc.x = (x / window.innerWidth) * 2 - 1;
  ndc.y = -(y / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...chunkMeshes.values()].flatMap(c => c.list), true)[0];
  return hit ? hit.point : null;
}
function fireAt(x, y) {
  const a = aim({ clientX: x, clientY: y });
  const rect = canvas.getBoundingClientRect();
  lastShot = { click: [Math.round(x), Math.round(y)], canvas: [rect.left, rect.top, rect.width, rect.height],
    dpr: devicePixelRatio, aimDig: a ? a.dig : null, aimPoint: a ? [a.point.x, a.point.y, a.point.z].map(v => +v.toFixed(3)) : null,
    aimEnemy: a && a.enemy ? a.enemy.kind : null, origin: [px, +(py + HH * 0.7).toFixed(3), pz] };
  const hitEnemy = (a && a.enemy) || enemyAt(x, y);
  if (hitEnemy) {
    // Aim at the middle of the enemy you hit, so the fireball flies to it
    const en = hitEnemy;
    const to = new THREE.Vector3(en.x - px, en.y + 0.5 - (py + HH * 0.7), en.z - pz);
    if (to.lengthSq() > 0.01) return castFireball(to, en);
  }
  // A block (or ground) was clicked: aim from the chest at the exact point that was hit, so the fireball lands on that block.
  // Aiming along the camera ray instead would miss, because the camera is behind and above the character.
  const origin = new THREE.Vector3(px, py + HH * 0.7, pz);
  let target = a && a.point;
  const sight = sightPoint(x, y);   // water surface, if the nearest thing seen is water
  if (sight && (!target || sight.distanceTo(camera.position) < target.distanceTo(camera.position))) target = sight;
  if (target) {
    const to = target.clone().sub(origin);
    if (to.lengthSq() > 0.04) return castFireball(to);
  }
  // Nothing was hit: a point far along the click's ray, seen from the chest
  castFireball(ray.ray.at(60, new THREE.Vector3()).sub(origin));
}

// Moves the fireballs. A fireball bursts when it hits an enemy or a block, or when its time runs out.
// Enemies inside the burst take fire damage. Blocks are never changed.
function updateFireballs(dt) {
  spellCool = Math.max(0, spellCool - dt);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.t += dt;
    p.vy -= 9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.m.position.set(p.x, p.y, p.z);
    p.mat.opacity = Math.max(0, 1 - p.t / 0.5);
    if (p.t >= 0.5) { scene.remove(p.m); p.mat.dispose(); sparks.splice(i, 1); }
  }
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i], s = FIRE[f.tier];
    f.t += dt;
    if (f.homing && enemies.includes(f.homing)) {
      // Turn gently toward the enemy's middle, keeping the same speed
      const en = f.homing;
      const tx = en.x - f.x, ty = en.y + 0.5 - f.y, tz = en.z - f.z;
      const len = Math.hypot(tx, ty, tz) || 1;
      const k = Math.min(1, dt * 8);
      const sp = Math.hypot(f.vx, f.vy, f.vz) || s.speed;
      let nx = f.vx / sp * (1 - k) + tx / len * k, ny = f.vy / sp * (1 - k) + ty / len * k, nz = f.vz / sp * (1 - k) + tz / len * k;
      const nl = Math.hypot(nx, ny, nz) || 1;
      f.vx = nx / nl * s.speed; f.vy = ny / nl * s.speed; f.vz = nz / nl * s.speed;
    } else f.homing = null;
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
    f.mesh.position.set(f.x, f.y, f.z);
    // A new fireball is not checked for walls for its first moment, so it does not burst at the character
    const here = get(Math.floor(f.x), Math.floor(f.y), Math.floor(f.z));
    const nearEnemy = enemies.some(en => Math.hypot(en.x - f.x, en.y + 0.5 - f.y, en.z - f.z) < 0.8);
    // Water puts the fireball out: a puff of steam, no blast and no damage. Only an enemy or the time running out makes a blast.
    if (f.t > 0.15 && here === T.WATER && !nearEnemy && f.t < f.life) {
      if (lastShot && !lastShot.burst) {
        lastShot.burst = [Math.floor(f.x), Math.floor(f.y), Math.floor(f.z)];
        lastShot.burstBy = 'water';
        if (fireDebug) console.log('[fireDebug] shot', JSON.stringify(lastShot));
      }
      scene.remove(f.mesh);
      fireballs.splice(i, 1);
      steamPuff(f.x, f.y, f.z);
      sfx('fizzle');
      continue;
    }
    let boom = f.t >= f.life || (f.t > 0.15 && here !== T.AIR);
    if (!boom) boom = nearEnemy;
    if (!boom) continue;
    for (const en of [...enemies]) {
      if (Math.hypot(en.x - f.x, en.y + 0.5 - f.y, en.z - f.z) < s.boom) hurtEnemy(en, damageTo(en, s.dmg, 'fire'));
    }
    if (lastShot && !lastShot.burst) {
      lastShot.burst = [Math.floor(f.x), Math.floor(f.y), Math.floor(f.z)];
      lastShot.burstBy = f.t >= f.life ? 'time' : (here !== T.AIR ? 'block' : 'enemy');
      if (fireDebug) console.log('[fireDebug] shot', JSON.stringify(lastShot));
    }
    scene.remove(f.mesh);
    fireballs.splice(i, 1);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffc04a, transparent: true, opacity: 0.8 });
    const flash = new THREE.Mesh(fireGeo, mat);
    flash.position.set(f.x, f.y, f.z);
    scene.add(flash);
    blasts.push({ mesh: flash, mat, t: 0, max: s.boom });
    fireBurst(f.x, f.y, f.z, s.boom);
  }
  for (let i = blasts.length - 1; i >= 0; i--) {
    const b = blasts[i];
    b.t += dt;
    const k = Math.min(1, b.t / 0.3);
    b.mesh.scale.setScalar(0.2 + k * b.max);
    b.mat.opacity = 0.8 * (1 - k);
    if (k >= 1) { scene.remove(b.mesh); b.mat.dispose(); blasts.splice(i, 1); }
  }
}

const ray = new THREE.Raycaster();

// Looking up and down (0.6.76): one angle for both views. Negative looks down. The view from behind starts as before,
// looking down at the character; it stops at 80 degrees each way.
const PITCH_MAX = 80 * Math.PI / 180, PITCH_BACK = -Math.atan2(4, 9);

const VIEW_KEY = 'kidsgame.view';

// Which block or enemy the press landed on, and the cell it would dig or build in
function aim(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...solidMeshes(), ...enemies.map(en => en.group)], true)[0];
  if (!hit) return null;
  const enemy = hit.object.userData.enemy || null;
  const d = ray.ray.direction, p = hit.point, e2 = 0.01;
  const dig = [Math.floor(p.x + d.x * e2), Math.floor(p.y + d.y * e2), Math.floor(p.z + d.z * e2)];
  // Reach is measured from the character, not the camera (the camera is far behind)
  const dist = Math.hypot(dig[0] + 0.5 - px, dig[1] + 0.5 - (py + HH / 2), dig[2] + 0.5 - pz);
  return {
    enemy, dist, dig, point: p,
    place: [Math.floor(p.x - d.x * e2), Math.floor(p.y - d.y * e2), Math.floor(p.z - d.z * e2)]

// Right-click: build with a block from the quick bar, even when another slot is selected.
// Uses the selected slot if it holds a block, otherwise the first block slot with stock.
canvas.addEventListener('contextmenu', e => e.preventDefault());
function blockFromQuickBar() {
  const isBlock = id => id && ITEMS[id] && ITEMS[id].kind === 'block' && inv[id] > 0;
  if (isBlock(held())) return held();
  return qb.find(isBlock) || null;
}

canvas.addEventListener('pointerdown', e => {
  if (e.button === 2 && defOf(held()) && defOf(held()).kind === 'spell') { fireAt(e.clientX, e.clientY); return; }
  if (e.button === 2) {
    const a = aim(e);
    if (!a || a.enemy) return;
    if (a.dist > REACH) { say('Too far away! Get closer.'); return; }
    const id = blockFromQuickBar();
    if (!id) { say('Put a block in a quick bar slot first.', 2000); return; }
    placeCell(...a.place, id);
    return;
  }
  if (touches.size > 1) return; // two fingers = pinch
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, lastX: e.clientX, lastY: e.clientY, moved: false };
  pendingPlace = null;
  // A press on a quiz friend never digs, builds, fights or casts: if it was a tap, the question opens on release (0.6.63)
  pendingFriend = !!(friendAt(e.clientX, e.clientY) || mirrorFriendAt(e.clientX, e.clientY));
  if (pendingFriend) return;
  // A press on a merchant's cart never digs or fights: if it was a tap, the trades open on release (0.6.77)
  pendingMerchant = merchantAt(e.clientX, e.clientY);
  if (pendingMerchant) return;
  // The Spell button is lit: this tap only casts. It does not dig, build or hit (0.6.74)
  if (spellArmed) { pendingCast = { x: e.clientX, y: e.clientY }; return; }
  if (defOf(held()) && defOf(held()).kind === 'spell') { pendingCast = { x: e.clientX, y: e.clientY }; return; }
  const a = aim(e);
  if (!a) return;
  if (a.enemy) {
    if (swordGap(a.enemy) > SWORD_REACH) { say('Too far away! Get closer.'); return; }
    // A sword in the hand hits on the tap and keeps hitting while held. With another item in the hand, a sword on a hand button
    // (quick bar slot 1 or 2) swings once straight away; the item in the hand stays in the hand (0.6.60).
    const isWeapon = id => !!(id && defOf(id) && defOf(id).kind === 'weapon');
    const borrowed = isWeapon(held()) ? null : ([qb[0], qb[1]].find(isWeapon) || null);
    if (!isWeapon(held()) && !borrowed) { say('Put a sword on a hand button', 2000); return; }
    digging = null;
    if (borrowed) {
      if (swingCool > 0) return;   // a swing takes a moment: faster taps do not hit again
      swingOnce(a.enemy, borrowed);
      if (enemies.includes(a.enemy) && gearOf(borrowed)) fight = { e: a.enemy, t: 0, id: borrowed };   // holding keeps hitting at the usual pace
      return;
    }
    // A sword in the hand: a tap hits once straight away (0.6.66; before, only holding hit). Holding keeps hitting at the usual pace.
    // A swing takes a moment, so faster taps do not hit again.
    const sword = held();
    if (swingCool <= 0) swingOnce(a.enemy, sword);
    if (enemies.includes(a.enemy) && gearOf(sword)) fight = { e: a.enemy, t: 0, id: sword };
    return;
  }
  if (a.dist > REACH) { say('Too far away! Get closer.'); return; }
  const [dx, dy, dz] = a.dig;
  // A block in hand builds: a tap on the side or top of a block puts the new block against it (0.6.62).
  // Before, a tap on a block always tried to dig, so a touch screen (which has no right-click) could not build at all.
  const hb = held(), blockInHand = !!(hb && ITEMS[hb] && ITEMS[hb].kind === 'block');
  if (blockInHand) {
    pendingPlace = a.place; // build on release, so a drag does not build
  } else if (solid(get(dx, dy, dz))) {
    if (friendOn(dx, dy, dz)) { say('Your friend is standing there.', 2000); return; }
    if (tplOf(held()) !== 'pick' && !handDigTold) { handDigTold = true; say('Digging by hand is slow. The pickaxe is faster.', 3500); }
    digging = { x: dx, y: dy, z: dz, t: 0 };
    armSwing = 0;
  } else {
    pendingPlace = a.place; // build on release, so a drag does not build
  }
});
canvas.addEventListener('pointerup', e => {
  if (press && press.id === e.pointerId && !press.moved && pendingPlace) placeCell(...pendingPlace);
  if (press && press.id === e.pointerId && !press.moved && pendingCast) {
    const before = fireballs.length;
    fireAt(pendingCast.x, pendingCast.y);
    if (spellArmed && fireballs.length > before) armSpell(false);   // cast: the button goes dark again
  }
  if (spellArmed && press && press.id === e.pointerId && press.moved) spellArmedAt = performance.now();   // a drag turns the camera, casts nothing and leaves the button lit
  if (press && press.id === e.pointerId && !press.moved && pendingFriend) { tapFriend(); if (spellArmed) armSpell(false); }
  if (press && press.id === e.pointerId && !press.moved && pendingMerchant) { tapMerchant(pendingMerchant); if (spellArmed) armSpell(false); }
  pendingFriend = false;
  pendingMerchant = null;
  pendingPlace = null;
  pendingCast = null;
  press = null;
  digging = null;
  fight = null;
});

// Keep digging progress in step with the held block; cancel if we walk away
function updateDig(dt) {
  if (!digging) { crack.visible = false; return; }
  const { x, y, z } = digging;
  const dist = Math.hypot(x + 0.5 - px, y + 0.5 - (py + HH / 2), z + 0.5 - pz);
  if (!solid(get(x, y, z)) || dist > REACH + 1) { digging = null; crack.visible = false; return; }
  digging.t += dt;
  const progress = Math.min(1, digging.t / (digTime() * digSlow(get(x, y, z))));
  crack.visible = true;
  crack.position.set(x + 0.5, y + 0.5, z + 0.5);
  crack.material.opacity = progress * 0.6;
  if (progress >= 1) {
    const done = digCell(x, y, z);
    digging = null;
    crack.visible = false;
    if (!done) press = null;
  }
}

// ---- Vital the elephant, your guide (0.6.73, SPEC-011) ----
// A small grey elephant, made here in code, comes around and shows a new player how to play, one short tip at a time.
// He only gives tips: no questions and no gems. The child can say "OK" or "No more tips"; then he stays away and
// checks in again every third visit. Which tips were seen, that choice, the count of visits and the Settings switch
// are kept on this device only. Nothing is sent or logged.
const VITAL_TIPS = [   // [on a tablet or phone, on a computer (left out when it is the same)]
  ['Hi! I am Vital. I can show you how to play.'],
  ['Push the thumb stick to walk. Tap JUMP to jump.', 'Use W A S D to walk. Press Space to jump.'],
  ['Drag sideways with a finger to turn the view.', 'Drag sideways with the mouse to turn the view.'],
  ['Hold a finger on a block to dig it. The pickaxe is the fastest.', 'Hold the mouse button on a block to dig it. The pickaxe is the fastest.'],
  ['Choose a block. Tap the side or top of another block to build.', 'Choose a block. Click the side or top of another block to build.'],
  ['Gems sparkle inside some blocks. Dig the block to get the gem.'],
  ['Tap Bag to see your things. Tap one to put it in your quick bar.', 'Press B to see your things. Click one to put it in your quick bar.'],
  ['Monsters never hurt you. Choose the sword and tap one to hit it.', 'Monsters never hurt you. Choose the sword and click one to hit it.'],
  ['A friend with a ? has a question. A right answer gives you gems.'],
  ['Bag full? Open the bag and tap Drop to make room.', 'Bag full? Open the bag and click Drop to make room.'],
  ['In water, hold JUMP to swim up.', 'In water, hold Space to swim up.'],
  ['Lost? Tap the teleport button. After a wait it takes you back to the start.'],
];
const VITAL_FIRST = 3;          // at the start of a visit he comes this many seconds after play starts
const VITAL_GAP = 120;          // then again after this many seconds of the child moving about
const VITAL_MAX = 4;            // he comes at most this many times in one visit
const VITAL_SKIP = 2;           // after "No more tips" he stays away for the rest of the visit and this many more visits
const VITAL_FRIEND_AFTER = 20;  // a quiz friend comes no sooner than this many seconds after Vital has left
const VITAL_KEY = 'kidsgame.vital';
// on: the "Tips from Vital" switch. seen: how many tips, in order, were answered with OK. ask: he is away and will
// ask "Do you want tips?" when he is back. skip: visits still to stay away.
function vitalFrom(v) {
  const out = { on: true, seen: 0, ask: false, skip: 0 };
  if (!v || typeof v !== 'object') return out;
  out.on = v.on !== false;
  if (Number.isInteger(v.seen) && v.seen >= 0) out.seen = Math.min(v.seen, VITAL_TIPS.length);
  out.ask = v.ask === true;
  if (Number.isInteger(v.skip) && v.skip >= 0) out.skip = Math.min(v.skip, VITAL_SKIP);
  return out;
}
let vital = vitalFrom(null);
try { vital = vitalFrom(JSON.parse(localStorage.getItem(VITAL_KEY))); } catch (e) {}
function vitalSave() { try { localStorage.setItem(VITAL_KEY, JSON.stringify(vital)); } catch (e) {} }
let vitalVisit = null;          // this visit: is he due, how often he came, the wait until he comes next
let tipPanel = null;            // the open tip panel, if any
// A visit is one opening of the game in which play starts. A visit he stays away for is counted here.
function vitalStartVisit() {
  let due = true;
  if (vital.ask && vital.skip > 0) { vital.skip--; vitalSave(); due = false; }
  vitalVisit = { due, came: 0, wait: VITAL_FIRST, first: true };
}
// True when he should still come in this visit: tips are on, and a tip is left or it is time to ask again
const vitalDue = () => vital.on && !!vitalVisit && vitalVisit.due && vitalVisit.came < VITAL_MAX && (vital.ask || vital.seen < VITAL_TIPS.length);
const vitalTipText = i => { const t = VITAL_TIPS[i]; return isTouch ? t[0] : t[1] || t[0]; };
// Called when Vital has left: he comes back after two minutes of moving about. If he asked "Do you want tips?" and
// got no answer, he does not ask again in this visit.
function vitalLeft() {
  if (!vitalVisit) return;
  vitalVisit.first = false;
  vitalVisit.wait = VITAL_GAP;
  if (vital.ask) vitalVisit.due = false;
}
// The tip panel: one tip in large letters with "OK" and "No more tips", or his question with "Yes" and "Not now".
// It opens only on a tap on Vital. The game stands still while it is open. No timer and nowhere to type.
function renderTip() {
  const f = friend, asking = f.tip === null;
  tipPanel.innerHTML = '<div class="tbox"><div class="tname">Vital</div>' +
    `<div class="ttext">${esc(asking ? 'Hi again! Do you want tips?' : vitalTipText(f.tip))}</div>` +
    (asking ? '<button class="tbig tyes">Yes</button><button class="tsmall tnot">Not now</button>' : '<button class="tbig tok">OK</button><button class="tsmall tno">No more tips</button>') + '</div>';
}
function openTip() {
  if (!friend || !friend.guide || tipPanel) return;
  const f = friend;
  if (f.tip === undefined) f.tip = vital.ask ? null : vital.seen;   // null: he asks whether tips are wanted
  if (f.state === 'come') f.state = 'wait';
  paused = true;
  const el = document.createElement('div');
  el.id = 'tipPanel';
  el.addEventListener('click', e => {
    if (e.target.closest('.tok')) tipOk();
    else if (e.target.closest('.tno')) tipNoMore();
    else if (e.target.closest('.tyes')) tipYes();
    else if (e.target.closest('.tnot')) tipNotNow();
    else if (e.target === el) tipClose();   // a tap outside the box
  });
  document.body.appendChild(el);
  tipPanel = el;
  renderTip();
  sfx('open');
}
function closeTip() {
  if (!tipPanel) return;
  tipPanel.remove();
  tipPanel = null;
  paused = false;
  sfx('close');
}
// Closed any other way (Esc, the Back button, a tap outside): the tip stays unseen. He waits 20 seconds more, then leaves.
function tipClose() {
  if (!tipPanel) return;
  closeTip();
  if (friend && friend.guide) friend.age = Math.max(friend.age, FRIEND_STAY - 20);
}
// "OK": the tip counts as seen, and he waves and leaves. After the last tip he checks in every third visit.
function tipOk() {
  const f = friend;
  if (!tipPanel || !f || !f.guide || f.tip === null) return;
  if (!f.again) vital.seen = Math.max(vital.seen, f.tip + 1);
  if (f.again || vital.seen >= VITAL_TIPS.length) { vital.ask = true; vital.skip = VITAL_SKIP; vitalVisit.due = false; }
  vitalSave();
  closeTip();
  friendLeave();
}
// "No more tips" and "Not now": he leaves, and stays away for the rest of this visit and the next two
function vitalAway(text) {
  if (!tipPanel || !friend || !friend.guide) return;
  vital.ask = true; vital.skip = VITAL_SKIP;
  if (vitalVisit) vitalVisit.due = false;
  vitalSave();

  if (text) say(text, 3000);
