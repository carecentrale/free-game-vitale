# Runs the tests on every push and pull request, every 6 hours, and by hand from the Actions tab.
# A failing test shows as a red cross on the commit.
name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours, re-runs the tests on main without a new push
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
