# Runs the fast tests, then deploys the www folder to Firebase Hosting (Google Cloud). By hand only since 18 Nov 2026 (Actions tab, Run workflow): on every push it ran the long browser tests for 45 minutes and failed.
# Needed once, in GitHub → Settings → Secrets and variables → Actions:
#   Secret:   FIREBASE_SERVICE_ACCOUNT   the service account key JSON for Firebase Hosting
#   Variable: FIREBASE_PROJECT_ID        the Firebase / Google Cloud project ID
# See docs/FIREBASE_SETUP.md for the steps.

name: Deploy to Firebase Hosting

on:
  # no push trigger: run by hand

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # long browser tests are not run here: Actions tab, Tests, Run workflow
      - name: Run the fast tests
        run: npm run test:quick

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
