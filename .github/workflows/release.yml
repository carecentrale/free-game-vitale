# Builds the Android app and uploads it to Google Play.
# Runs when you push a version tag (for example v0.5.0), or by hand from the Actions tab.
#
# Needed once, in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:
#     ANDROID_KEYSTORE_BASE64   the upload keystore file, base64-encoded
#     KEYSTORE_PASSWORD         keystore password
#     KEY_ALIAS                 key alias inside the keystore
#     KEY_PASSWORD              key password
#     PLAY_SERVICE_ACCOUNT_JSON service account key JSON for the Play Console API
#   Variables:
#     APP_ID                    the appId from capacitor.config.json (com.drenerics.adventurers)

name: Release to Google Play

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ vars.APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        run: npm install

      - name: Copy the game into the web folder
        run: |
          mkdir -p www
          cp build/prototype-3d-v7.html www/index.html

      - name: Create the Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          # Google Play needs Android 16 (API 36) as the target and Android 7 (API 24) as the minimum (Capacitor 8 defaults)
          grep -E 'minSdkVersion|targetSdkVersion|compileSdkVersion' android/variables.gradle

      - name: Allow Google Play purchases (billing permission)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'com.android.vending.BILLING' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="com.android.vending.BILLING" />\n</manifest>#' "$M"
          grep -n 'uses-permission' "$M"

      - name: Set version name and code
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Run by hand (no version tag): use the version written in the game file
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(grep -oE "const VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" build/prototype-3d-v7.html | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          fi
          echo "Version name: $VERSION, version code: $GITHUB_RUN_NUMBER"
          # Name used for the download, so each build can be told apart (for example drenerics-0.6.56-code3)
          echo "BUILD_NAME=drenerics-${VERSION}-code${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle

      - name: Add the signing setup
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          sed -i "s/    buildTypes {/    signingConfigs {\n        release {\n            storeFile file('release.keystore')\n            storePassword System.getenv('KEYSTORE_PASSWORD')\n            keyAlias System.getenv('KEY_ALIAS')\n            keyPassword System.getenv('KEY_PASSWORD')\n        }\n    }\n    buildTypes {/" android/app/build.gradle
          sed -i "0,/minifyEnabled false/s//minifyEnabled false\n            signingConfig signingConfigs.release/" android/app/build.gradle

      - name: Build the app bundle (.aab)
        working-directory: android
        # The signing setup reads these passwords while the bundle is built, so this step needs them too
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Name the bundle by version and build number
        run: cp android/app/build/outputs/bundle/release/app-release.aab "${BUILD_NAME}.aab"

      - name: Keep the bundle as a download (the first one goes to Play Console by hand)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: ${{ env.BUILD_NAME }}.aab

      - name: Upload to Google Play (internal testing track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.APP_ID }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

