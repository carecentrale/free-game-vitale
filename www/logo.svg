<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="0.7" stop-color="#cdeeff"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee04f"/>
      <stop offset="1" stop-color="#3d9a2c"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a33"/>
      <stop offset="1" stop-color="#4e3220"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7a8c"/>
      <stop offset="1" stop-color="#2f3947"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#c39bff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8e44ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c8ff"/>
      <stop offset="0.5" stop-color="#9b59d6"/>
      <stop offset="1" stop-color="#5b2a86"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#b8c9dc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1d2a3d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- Sun and clouds -->
  <circle cx="1040" cy="110" r="70" fill="#ffe27a" opacity="0.9"/>
  <circle cx="1040" cy="110" r="110" fill="#ffe27a" opacity="0.18"/>
  <g fill="#ffffff" opacity="0.9">
    <rect x="120" y="90" width="110" height="34" rx="17"/>
    <rect x="150" y="70" width="60" height="34" rx="17"/>
    <rect x="860" y="170" width="130" height="34" rx="17"/>
    <rect x="890" y="150" width="70" height="34" rx="17"/>
  </g>

  <!-- Floating island (blocks) -->
  <g filter="url(#soft)">
    <!-- stone base -->
    <polygon points="360,290 840,290 800,400 430,430 380,380" fill="url(#stone)"/>
    <!-- dirt layer -->
    <polygon points="380,270 820,270 840,290 360,290" fill="url(#dirt)"/>
    <rect x="360" y="290" width="480" height="30" fill="url(#dirt)"/>
    <!-- grass top -->
    <polygon points="330,250 870,250 820,270 380,270" fill="url(#grass)"/>
    <polygon points="430,215 770,215 790,250 410,250" fill="url(#grass)"/>
    <!-- hill with castle -->
    <polygon points="500,215 700,215 650,160 550,160" fill="#4bb13a"/>
    <!-- stepped blocks down the sides -->
    <rect x="330" y="250" width="30" height="30" fill="#4e3220"/>
    <rect x="840" y="250" width="30" height="30" fill="#4e3220"/>
    <rect x="380" y="270" width="30" height="20" fill="#4e3220"/>
    <rect x="790" y="270" width="30" height="20" fill="#4e3220"/>
  </g>

  <!-- Castle on the hill -->
  <g filter="url(#soft)">
    <rect x="555" y="90" width="90" height="75" fill="#c9d3e0"/>
    <rect x="530" y="120" width="30" height="45" fill="#aab7c8"/>
    <rect x="645" y="120" width="30" height="45" fill="#aab7c8"/>
    <!-- battlements -->
    <rect x="555" y="78" width="16" height="14" fill="#c9d3e0"/>
    <rect x="579" y="78" width="16" height="14" fill="#c9d3e0"/>
    <rect x="603" y="78" width="16" height="14" fill="#c9d3e0"/>
    <rect x="627" y="78" width="18" height="14" fill="#c9d3e0"/>
    <!-- roofs -->
    <polygon points="520,120 545,70 570,120" fill="#8e44ad"/>
    <polygon points="630,120 660,64 690,120" fill="#8e44ad"/>
    <!-- gate and window -->
    <path d="M588 165 v-22 a12 12 0 0 1 24 0 v22 z" fill="#2f3947"/>
    <rect x="598" y="98" width="6" height="14" fill="#2f3947"/>
  </g>

  <!-- Crossed sword -->
  <g filter="url(#soft)">
    <g transform="translate(900 120) rotate(35)">
      <rect x="-6" y="-70" width="12" height="110" rx="3" fill="url(#blade)"/>
      <polygon points="-6,-70 6,-70 0,-92" fill="#eef6ff"/>
      <rect x="-30" y="40" width="60" height="12" rx="4" fill="#ffd45c"/>
      <rect x="-6" y="52" width="12" height="28" rx="4" fill="#8a5a33"/>
      <circle cx="0" cy="88" r="8" fill="#ffd45c"/>
    </g>
  </g>

  <!-- Glowing purple gem -->
  <circle cx="250" cy="250" r="90" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <polygon points="250,200 282,232 250,300 218,232" fill="url(#gem)"/>
    <polygon points="250,200 282,232 250,232 218,232" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M330 170 l6 -18 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 z" opacity="0.9"/>
    <path d="M180 330 l4 -12 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 z" opacity="0.8"/>
    <path d="M960 330 l5 -15 l5 15 l15 5 l-15 5 l-5 15 l-5 -15 l-15 -5 z" opacity="0.85"/>
  </g>

  <!-- Title -->
  <g text-anchor="middle" font-family="Trebuchet MS, Verdana, Segoe UI, sans-serif">
    <text x="600" y="458" font-size="58" font-weight="800" fill="#1d2a3d" stroke="#ffffff" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Adventurers of Drenerics</text>
  </g>
</svg>
