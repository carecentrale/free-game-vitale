const rnd = (a, b) => a + Math.random() * (b - a);

}

    g.beginPath();
    g.moveTo(rnd(0, S), rnd(0, S));
    g.lineTo(rnd(0, S), rnd(0, S));

});

  noise(g, S, 0x7a7a7a, 0.1);
  for (let i = 0; i < 7; i++) {

// Only the blocks near the player are drawn, and only those that can be seen (not blocks buried in the ground).
// The land is drawn one chunk at a time, each chunk with its own meshes. New chunks are made a few per frame
// (BUILD_MS), nearest first, so the game does not stop to draw. Chunks far behind the player are removed.
const VIEW = 8;                                   // chunks drawn in each direction around the player (17 x 17 chunks, 272 blocks across)
const BUILD_MS = 8;                               // time per frame spent making new chunk meshes
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const m4 = new THREE.Matrix4();
const drawTypes = [T.GRASS, T.DIRT, T.STONE, T.GEM, T.SAND, T.WATER];
const worldGroup = new THREE.Group();
scene.add(worldGroup);
const chunkMeshes = new Map();   // ckey -> { cx, cz, list: [InstancedMesh], count }
const waiting = [];              // chunks not drawn yet, nearest first
let drawnChunk = '';             // the chunk the player was in when the view was last set
let lastDrawn = 0;               // blocks drawn now
let lastRebuildMs = 0;           // time spent drawing in the last frame, for the browser test
const chunkInPlay = (cx, cz) => inPlay(cx * CS, cz * CS);
// Short status for the parent area: shows whether blocks are being drawn and where the player is
function worldStatus() {

  const at = Number.isFinite(px) ? Math.round(px) + ',' + Math.round(py) + ',' + Math.round(pz) : '?';
  return 'World: seed ' + seed + ' · ' + chunks.size + ' chunks in memory · ' + edited.size + ' changed · ' +
    lastDrawn + ' blocks drawn · player at ' + at + ' · ground here ' + g;
}
// The solid meshes (water is left out, so a click reaches the ground under it)
function solidMeshes() {
  const out = [];
  for (const c of chunkMeshes.values()) for (const im of c.list) if (!im.userData.water) out.push(im);
  return out;
}
// Is a block's face hidden? Solid blocks are hidden when all six neighbours are solid.
// Water is hidden only inside a lake (no neighbour is air), so lake surfaces and shores show.
function faceHidden(x, y, z, t) {
  if (t === T.WATER) {
    return get(x + 1, y, z) !== T.AIR && get(x - 1, y, z) !== T.AIR && get(x, y + 1, z) !== T.AIR &&
      get(x, y - 1, z) !== T.AIR && get(x, y, z + 1) !== T.AIR && get(x, y, z - 1) !== T.AIR;
  }
  return solid(get(x + 1, y, z)) && solid(get(x - 1, y, z)) && solid(get(x, y + 1, z)) &&
    solid(get(x, y - 1, z)) && solid(get(x, y, z + 1)) && solid(get(x, y, z - 1));
}
// The same test as faceHidden(), for a block inside a chunk: i is its place in the chunk's data
function innerFaceHidden(d, i, t) {
  const a = d[i + 1], b = d[i - 1], c = d[i + CS], e = d[i - CS], f = d[i + CS * CS], g = d[i - CS * CS];
  if (t === T.WATER) return a !== T.AIR && b !== T.AIR && c !== T.AIR && e !== T.AIR && f !== T.AIR && g !== T.AIR;
  return solid(a) && solid(b) && solid(c) && solid(e) && solid(f) && solid(g);
}
// Makes the meshes for one chunk: one instanced mesh per block type, with only the faces that can be seen
function buildChunkMeshes(cx, cz) {
  const lists = {};
  for (const t of drawTypes) lists[t] = [];
  const data = chunkAt(cx, cz).data;
  const SY = CS * CS;
  for (let y = 0; y < H; y++) for (let lz = 0; lz < CS; lz++) for (let lx = 0; lx < CS; lx++) {
    const i = cellIndex(lx, y, lz);
    const t = data[i];
    if (!t) continue;
    const x = cx * CS + lx, z = cz * CS + lz;
    // Inside the chunk the six neighbours are read straight from the data; the edges use the general lookup
    const inside = lx > 0 && lx < CS - 1 && lz > 0 && lz < CS - 1 && y > 0 && y < H - 1;
    const hidden = inside ? innerFaceHidden(data, i, t) : faceHidden(x, y, z, t);
    if (hidden) continue;
    lists[t].push(x, y, z);
  }
  const list = [];
  let count = 0;
  for (const t of drawTypes) {
    const L = lists[t], n = L.length / 3;
    if (!n) continue;
    const im = new THREE.InstancedMesh(blockGeo, blockMats[t], n);
    for (let i = 0; i < n; i++) {
      m4.makeTranslation(L[3 * i] + 0.5, L[3 * i + 1] + 0.5, L[3 * i + 2] + 0.5);
      im.setMatrixAt(i, m4);
    }
    im.instanceMatrix.needsUpdate = true;
    im.userData.water = t === T.WATER;
    if (t === T.WATER) im.renderOrder = 1;   // water is drawn after the solid blocks
    worldGroup.add(im);
    list.push(im);
    count += n;
  }

}
function dropChunk(k) {
  const c = chunkMeshes.get(k);

// Keeps the drawn chunks in step with the player. Called every frame; it draws only what fits in the time budget.
function updateView(budgetMs = BUILD_MS) {
  const t0 = performance.now();
  const pcx = Math.floor(px / CS), pcz = Math.floor(pz / CS);
  if (viewReset) {
    for (const k of [...chunkMeshes.keys()]) dropChunk(k);
    viewReset = false;
    drawnChunk = '';
  }
  if (pcx + ',' + pcz !== drawnChunk) {
    drawnChunk = pcx + ',' + pcz;
    for (const k of [...chunkMeshes.keys()]) {
      const c = chunkMeshes.get(k);
      if (Math.abs(c.cx - pcx) > VIEW || Math.abs(c.cz - pcz) > VIEW) dropChunk(k);
    }
    waiting.length = 0;
    for (let cz = pcz - VIEW; cz <= pcz + VIEW; cz++) for (let cx = pcx - VIEW; cx <= pcx + VIEW; cx++) {
      if (!chunkInPlay(cx, cz) || chunkMeshes.has(ckey(cx, cz))) continue;
      waiting.push({ cx, cz, d: (cx - pcx) ** 2 + (cz - pcz) ** 2 });
    }
    waiting.sort((a, b) => a.d - b.d);
    // Keep memory small: forget generated chunks far from the player (changed chunks are kept)
    if (chunks.size > 2000) for (const [k, c] of chunks) {
      if (!edited.has(k) && (Math.abs(c.cx - pcx) > VIEW + 3 || Math.abs(c.cz - pcz) > VIEW + 3)) chunks.delete(k);
    }
  }
  // Chunks a player changed are drawn again first
  for (const [k, c] of touched) {
    if (chunkMeshes.has(k)) dropChunk(k);
    if (Math.abs(c.cx - pcx) <= VIEW && Math.abs(c.cz - pcz) <= VIEW && chunkInPlay(c.cx, c.cz)) waiting.unshift({ cx: c.cx, cz: c.cz, d: -1 });
  }
  touched.clear();
  while (waiting.length && performance.now() - t0 < budgetMs) {
    const w = waiting.shift();
    const k = ckey(w.cx, w.cz);
    if (chunkMeshes.has(k) || Math.abs(w.cx - pcx) > VIEW || Math.abs(w.cz - pcz) > VIEW) continue;
    const c = buildChunkMeshes(w.cx, w.cz);
    chunkMeshes.set(k, c);
    lastDrawn += c.count;
  }
  lastRebuildMs = performance.now() - t0;
}

// The top of the land near the middle of the world. Searches a small area only, so it stays fast in a huge world.
function topSpawnPoint() {
  let best = null;
  for (let dx = -12; dx <= 12; dx++) for (let dz = -12; dz <= 12; dz++) {
    const x = CENTER + dx, z = CENTER + dz;
    let y = H - 1;
    while (y > 0 && !solid(get(x, y, z))) y--;
    if (!solid(get(x, y, z))) continue;
    const d = Math.hypot(dx, dz);
    if (!best || y > best.y || (y === best.y && d < best.d)) best = { x, y, z, d };
  }
  if (!best) return [CENTER + 0.5, SURF + 3.01, CENTER + 0.5];
  return [best.x + 0.5, best.y + 3.01, best.z + 0.5];   // two blocks above the top, so the character drops onto the land
}

let vx = 0, vy = 0, vz = 0, onGround = false, jumpHeld = false, squash = 0, walkT = 0;

function hits(x, y, z) {
  for (const dx of [-HW, HW]) for (const dz of [-HW, HW]) for (const dy of [0.01, HH - 0.01]) {
    if (solid(get(Math.floor(x + dx), Math.floor(y + dy), Math.floor(z + dz)))) return true;
  }
  return false;
}

// ---- Teleport to the start: free. Cast for 5 minutes, then wait 1 hour before the next one ----
const TELE_CAST = 5 * 60;                 // seconds to cast
const TELE_RECHARGE = 60 * 60 * 1000;     // ms until it can be used again
const teleBtn = document.getElementById('teleBtn');
let teleCast = -1;                        // seconds left in the cast, -1 when not casting
let teleEndAt = 0;                        // clock time (ms) when the cast finishes; keeps time while the tab is in the background
let teleReadyAt = 0;                      // time (ms) when the next teleport is ready
try { teleReadyAt = Number(localStorage.getItem('teleReadyAt')) || 0; } catch (e) {}
function fmtWait(ms) {
  const m = Math.ceil(ms / 60000);
  return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min';
}
teleBtn.addEventListener('click', () => {
  if (teleCast >= 0) { say('Casting the teleport...', 1500); return; }
  const left = teleReadyAt - Date.now();
  if (left > 0) { say('Teleport ready in ' + fmtWait(left), 2000); return; }
  teleEndAt = Date.now() + TELE_CAST * 1000;
  teleCast = TELE_CAST;
  say('Casting the teleport... ' + Math.ceil(TELE_CAST / 60) + ' minutes', 2500);
});
// Keeps the cast finishing even when the game tab is in the background (the game loop is paused then)
setInterval(() => { if (teleCast >= 0) updateTeleport(0); }, 1000);
function fmtCountdown(sec) {
  const t = Math.max(0, Math.ceil(sec));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}
function updateTeleport(dt) {
  if (teleCast >= 0) {
    // Use the clock, not the frame time: the game loop pauses when the tab is in the background
    teleCast = Math.max(0, (teleEndAt - Date.now()) / 1000);
    if (teleCast <= 0) {
      teleCast = -1;
      // Start point, three blocks up so the character drops in safely
      [px, py, pz] = topSpawnPoint();
      vx = 0; vy = 0; vz = 0;
      teleReadyAt = Date.now() + TELE_RECHARGE;
      try { localStorage.setItem('teleReadyAt', String(teleReadyAt)); } catch (e) {}
      say('Teleported to the start', 2000);
    }
  }
  const wait = teleCast < 0 && teleReadyAt - Date.now() > 0;
  teleBtn.classList.toggle('wait', teleCast >= 0 || wait);
  teleBtn.title = teleCast >= 0 ? 'Casting...' : wait ? 'Ready in ' + fmtWait(teleReadyAt - Date.now()) : 'Teleport to the start';
  // While casting, the button counts down (m:ss) so it is clear the teleport is in progress
  const label = teleCast >= 0 ? fmtCountdown(teleCast) : '&#10022;';
  if (teleBtn.dataset.label !== label) {
    teleBtn.dataset.label = label;
    teleBtn.innerHTML = label;
    teleBtn.style.fontSize = teleCast >= 0 ? '11px' : '18px';
  }
}

// Finish digging the block at (x,y,z). If the bag is full, the block is dropped on the ground to pick up later.
function digCell(x, y, z) {
  const t = get(x, y, z);
  if (!solid(t)) return false;
  const full = invTotal() >= invCap();
  if (full && drops.size >= MAX_DROPS) { say('Too many things on the ground. Pick some up first.', 2500); return false; }
  setBlock(x, y, z, T.AIR);
  shareBlock(x, y, z, T.AIR);
  const id = (t === T.GRASS || t === T.DIRT || t === T.SAND) ? 'dirt' : (t === T.STONE ? 'stone' : 'gem');
  if (full) {
    addDrop(x, y, z, id);
    say(ITEMS[id].name + ' dropped on the ground. Make room in your bag to pick it up.', 2500);
  } else {
    if (id === 'gem') say('+1 gem!', 1200);
    addItem(id);
  }
  gain('dig', 1);
  dirty = true;
  return true;
}

// ---- Drops: items left on the ground when the bag is full. Walk over one to pick it up when there is room. ----
// Drops are kept on this device only (they are not shared with other players yet).
const MAX_DROPS = 40;
const DROP_TIME = 5 * 60 * 1000; // a dropped item disappears 5 minutes after it was dropped
const drops = new Map();                 // "x,y,z" -> { x, y, z, id, mesh, base }
const dropGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
const dropMats = {};
function dropMat(id) {
  if (!dropMats[id]) dropMats[id] = new THREE.MeshStandardMaterial({ color: ITEMS[id].color, roughness: 0.6 });
  return dropMats[id];
}
function addDrop(x, y, z, id, at = Date.now()) {
  const key = x + ',' + y + ',' + z;
  if (drops.has(key)) return;
  const mesh = new THREE.Mesh(dropGeo, dropMat(id));
  mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
  scene.add(mesh);
  drops.set(key, { x, y, z, id, mesh, base: y + 0.5, at });
  dirty = true;
}
function removeDrop(key) {
  const d = drops.get(key);
  if (!d) return;
  scene.remove(d.mesh);
  drops.delete(key);
}
function restoreDrops(list) {
  if (!Array.isArray(list)) return;
  for (const row of list.slice(0, MAX_DROPS)) {
    // Saves from before 0.6.26 have no drop time; those drops get a fresh 5 minutes
    if (!Array.isArray(row) || (row.length !== 4 && row.length !== 5)) continue;
    const [x, y, z, id, at] = row;
    if (!ITEMS[id] || !inBounds(x, y, z) || solid(get(x, y, z))) continue;
    if (row.length === 5 && Date.now() - at >= DROP_TIME) continue; // already expired while the game was closed

// Bob and spin the drops, and pick one up when the player stands next to it and the bag has room
function updateDrops(time) {
  for (const [key, d] of drops) {
    if (Date.now() - d.at >= DROP_TIME) { removeDrop(key); dirty = true; continue; } // gone after 5 minutes
    d.mesh.position.y = d.base + Math.sin(time * 3 + d.x) * 0.08;
    d.mesh.rotation.y = time * 1.5;
    const near = Math.hypot(d.x + 0.5 - px, d.z + 0.5 - pz) < 1.0 && py > d.y - 1 && py < d.y + 2;
    if (!near) continue;

    addItem(d.id);
    removeDrop(key);
    say('Picked up ' + ITEMS[d.id].name + '!', 1200);

let armSwing = 0; // quick arm swing when placing

// Build with the selected block in the quick bar
function placeCell(x, y, z, forceId) {
  if (!inBounds(x, y, z)) return;
  const id = forceId || held();
  const item = id ? ITEMS[id] : null;
  if (!item || item.kind !== 'block') {
    say(id ? 'Select a block in the quick bar to build.' : 'Put a block in a quick bar slot and select it.', 2000);
    return;
  }

  if (drops.has(x + ',' + y + ',' + z)) { say('Something is on the ground there. Walk over it to pick it up.', 2000); return; }
  if (!inv[id]) { say('No ' + item.name + ' left! Dig some first.'); return; }
  if (x < px + HW && x + 1 > px - HW && y < py + HH && y + 1 > py && z < pz + HW && z + 1 > pz - HW) {

// ---- Slimes: gentle creatures to fight with the sword (they never hurt the player) ----
const enemies = [];
let fight = null; // {e, t}: the slime being hit, and how long we have been hitting it
const slimeGeo = new THREE.SphereGeometry(0.4, 16, 12);

// ---- Enemies: friendly goblin-style creatures (they never hurt the player) ----

  imp:    { name: 'Imp',         body: 0xd9473b, head: 0xe05a4a, cloth: 0x3a2a4a, scale: 0.85, fight: 0.7, gems: 1, horns: true, file: '/models/imp.glb', height: 1.1 },
  brute:  { name: 'Brute',       body: 0x6b4a8a, head: 0x7a5aa0, cloth: 0x4a3a2a, scale: 1.35, fight: 2.2, gems: 3, pack: true },
  spear:  { name: 'Spear Imp',   body: 0xc0392b, head: 0xd9574a, cloth: 0x5a4a3a, scale: 0.95, fight: 1.2, gems: 2, spear: true, horns: true },

const ENEMY_LIST = Object.keys(ENEMY_KINDS);
const modelCache = {};
function loadModel(file) {

      .then(({ GLTFLoader }) => new Promise((ok, bad) => new GLTFLoader().load(file, gltf => ok(gltf.scene), undefined, bad)))
      .catch(() => null);

}
function enemyModel(kind) {
  const k = ENEMY_KINDS[kind];

      const size = box.getSize(new THREE.Vector3());
      const f = k.height / size.y;
      sc.scale.setScalar(f);
      sc.position.set(-(box.min.x + box.max.x) / 2 * f, -box.min.y * f, -(box.min.z + box.max.z) / 2 * f);
      sc.traverse(c => { c.userData.enemy = holder.userData.enemy; });

  }

  const box = (w, h, d, c, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mt(c)); b.position.set(x, y, z); return b; };
  const ball = (r, c, x, y, z, sy = 1) => { const b = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mt(c)); b.position.set(x, y, z); b.scale.y = sy; return b; };
  const tube = (r, h, c, x, y, z) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.1, h, 14), mt(c)); b.position.set(x, y, z); return b; };
  const eye = (x, y, z) => {
    const e = new THREE.Group();
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }));
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.036, 10, 8), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 }));
    p.position.z = 0.05;
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    shine.position.set(0.015, 0.02, 0.08);

    e.position.set(x, y, z);

    g.add(ball(0.24, k.head, 0, 0.55, 0.45));
    for (const x of [-0.25, 0, 0.25]) g.add(ball(0.09, 0x3a2a1a, x, 0.78, 0, 1.6));
    for (const [x, z] of [[-0.3, -0.18], [0.3, -0.18], [-0.3, 0.18], [0.3, 0.18]]) g.add(tube(0.07, 0.24, k.cloth, x, 0.12, z));
    g.add(eye(-0.09, 0.6, 0.66));
    g.add(eye(0.09, 0.6, 0.66));
    g.scale.setScalar(k.scale);
    return g;
  }
  g.add(ball(0.26, k.body, 0, 0.5, 0, 1.15));                // round body
  g.add(ball(0.24, k.head, 0, 1.02, 0));                    // round head
  if (k.hood) g.add(ball(0.27, k.cloth, 0, 1.12, -0.05, 0.7)); // hood
  for (const sx of [-1, 1]) {
    const ear = ball(0.09, k.head, sx * 0.25, 1.08, 0, 0.6);
    ear.rotation.z = sx * 0.6;
    g.add(ear);
    g.add(eye(sx * 0.1, 1.04, 0.2));                         // shiny eyes
    g.add(tube(0.07, 0.22, k.body, sx * 0.31, 0.52, 0));      // arms
    g.add(tube(0.08, 0.3, k.cloth, sx * 0.13, 0.15, 0));      // legs

  if (k.spear) { g.add(tube(0.025, 1.5, 0x8b5a2b, -0.42, 0.85, 0.12)); g.add(box(0.1, 0.2, 0.04, 0xdfe6ee, -0.42, 1.65, 0.12)); }
  if (k.scythe) { g.add(tube(0.025, 1.2, 0x5a3a20, 0.42, 0.7, 0.12)); g.add(box(0.36, 0.08, 0.05, 0xb0b8c0, 0.56, 1.3, 0.12)); }

function spawnSlime() {
  for (let tries = 0; tries < 20; tries++) {
    // Near the player, so enemies appear where the player can see them
    const x = Math.floor(px) + Math.floor(Math.random() * 40) - 20, z = Math.floor(pz) + Math.floor(Math.random() * 40) - 20;
    let y = H - 1;
    while (y > 0 && get(x, y, z) === T.AIR) y--;
    if (get(x, y, z) !== T.GRASS) continue;
    if (Math.hypot(x + 0.5 - px, z + 0.5 - pz) < 6) continue;
    const kind = ENEMY_LIST[Math.floor(Math.random() * ENEMY_LIST.length)];
    const group = enemyModel(kind);
    scene.add(group);
    const en = { group, kind, base: ENEMY_KINDS[kind].scale, x: x + 0.5, y: y + 1.01, z: z + 0.5, vx: 0, vy: 0, vz: 0, timer: 1, hitP: 0 };
    group.traverse(c => { c.userData.enemy = en; });
    group.userData.enemy = en; // so a model that loads later can be tagged too
    enemies.push(en);
    return;
  }
}
let slimeSpawnT = 6;
function updateSpawns(dt) {
  slimeSpawnT -= dt;
  if (enemies.length < 6 && slimeSpawnT <= 0) { spawnSlime(); slimeSpawnT = 6; }
}

// Like hits(), but for any size of box
function solidBox(x, y, z, hw, hh) {
  for (const dx of [-hw, hw]) for (const dz of [-hw, hw]) for (const dy of [0.01, hh - 0.01]) {
    if (solid(get(Math.floor(x + dx), Math.floor(y + dy), Math.floor(z + dz)))) return true;
  }
  return false;
}

// True if there is ground under (x, z) within one block below the enemy's feet.
// Stops enemies from walking off a ledge; a one-block step down is still allowed.
function groundBelow(x, z, y) {
  const cx = Math.floor(x), cz = Math.floor(z);
  for (let by = Math.floor(y - 0.1); by >= Math.floor(y - 1.2); by--) {
    if (solid(get(cx, by, cz))) return true;
  }
  return false;
}

function updateSlimes(dt) {
  const now = performance.now() / 1000;
  // Remove enemies that fell off the island, left the world, or hang in the air.
  // spawnSlime() puts new ones on the grass.
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    en.airT = groundBelow(en.x, en.z, en.y) ? 0 : (en.airT || 0) + dt;
    if (Math.hypot(en.x - px, en.z - pz) > 90) { scene.remove(en.group); enemies.splice(i, 1); continue; } // far away: leave quietly
    const why = en.y < 1 ? 'below the island'
      : !inPlay(en.x, en.z) ? 'outside the world'
      : en.airT > 3 ? 'stuck in the air' : '';
    if (why) {
      debugLog('enemy_off_map', why, en, en.x, en.y, en.z);
      scene.remove(en.group);
      enemies.splice(i, 1);
    }
  }
  for (const en of enemies) {
    en.timer -= dt;
    if (en.timer <= 0) {
      en.timer = 1.5 + Math.random() * 2.5;
      const a = Math.random() * Math.PI * 2;
      en.vx = Math.sin(a) * 1.0;
      en.vz = Math.cos(a) * 1.0;
      if (Math.random() < 0.3) { en.vx = 0; en.vz = 0; }
    }
    const nx = en.x + en.vx * dt;
    if (!solidBox(nx, en.y, en.z, 0.3, 0.8) && groundBelow(nx, en.z, en.y)) en.x = nx; else en.timer = 0;
    const nz = en.z + en.vz * dt;
    if (!solidBox(en.x, en.y, nz, 0.3, 0.8) && groundBelow(en.x, nz, en.y)) en.z = nz; else en.timer = 0;
    en.vy = Math.max(en.vy - GRAV * dt, -30);
    const ny = en.y + en.vy * dt;
    if (!solidBox(en.x, ny, en.z, 0.3, 0.8)) en.y = ny; else en.vy = 0;

    const sq = en.hitP * 0.25 + Math.sin(now * 5 + en.x) * 0.05;
    // Walk bounce and side sway while moving, slow breathing while standing.
    // The bounce stretches the body up and down; the feet stay on the block.
    const moving = en.vx || en.vz;
    const ph = now * 8 + en.x * 3;
    const bounce = moving ? Math.abs(Math.sin(ph)) * 0.08 : Math.sin(now * 2 + en.x) * 0.02;
    en.group.position.set(en.x, en.y, en.z);
    en.group.scale.set((1 + sq - bounce * 0.5) * en.base, (1 - sq + bounce) * en.base, (1 + sq - bounce * 0.5) * en.base);
    en.group.rotation.z = moving ? Math.sin(ph) * 0.08 : 0;
    if (moving) en.group.rotation.y = Math.atan2(en.vx, en.vz);
  }
  updateCorpses(dt);
}

// Defeated enemies lie on the ground for CORPSE_TIME seconds, then sink into the ground
const CORPSE_TIME = 300; // 5 minutes
const CORPSE_SINK = 3;   // seconds to sink out of sight
const corpses = [];
function updateCorpses(dt) {
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    c.t += dt;
    // After CORPSE_TIME every body sinks and disappears, even if it is still falling or hovering
    if (c.t >= CORPSE_TIME) {
      if (c.sinkY === undefined) c.sinkY = c.group.position.y;
      const s = Math.min(1, (c.t - CORPSE_TIME) / CORPSE_SINK);
      c.group.position.y = c.sinkY - s * 1.6;
      if (s >= 1) {
        scene.remove(c.group);
        corpses.splice(i, 1);
      }
      continue;
    }
    if (!c.landed) {
      c.vy = Math.max(c.vy - GRAV * dt, -30);
      const ny = c.group.position.y + c.vy * dt;
      const cy = Math.floor(ny - 0.01); // the block the body is about to enter
      if (cy < 0) {
        debugLog('corpse_void', 'fell into the void', { kind: c.kind }, c.x, ny, c.z);
        scene.remove(c.group); corpses.splice(i, 1); continue;
      }
      // Only land on blocks inside the island. Outside it, keep falling until the body leaves the map.
      const inside = inPlay(c.x, c.z);
      if (inside && solid(get(Math.floor(c.x), cy, Math.floor(c.z)))) {
        c.landed = true;
        c.restY = cy + 1 + c.lift;
        c.group.position.y = c.restY;
      } else {
        c.group.position.y = ny;
      }
      continue;
    }
    if (c.t < CORPSE_TIME) {
      // Still lying here: check the ground is still under it (a player may have dug it out).
      // If not, the body falls again.
      const below = Math.floor(c.restY - c.lift - 0.01);
      const supported = inPlay(c.x, c.z) && solid(get(Math.floor(c.x), below, Math.floor(c.z)));
      if (!supported) {
        // Record it in the enemy log: a body that was resting has lost the block under it
        debugLog('corpse_unsupported', 'ground under a resting body was dug out', { kind: c.kind }, c.x, c.restY, c.z);
        c.landed = false; c.vy = 0;
      }
      continue;
    }
  }
}

// Hold on a slime with the sword selected to attack it
function updateFight(dt) {
  if (!fight) { for (const en of enemies) en.hitP = 0; return; }
  const en = fight.e;
  if (!enemies.includes(en)) { fight = null; return; }
  const dist = Math.hypot(en.x - px, en.y - py, en.z - pz);
  if (dist > REACH + 1) { fight = null; en.hitP = 0; return; }
  fight.t += dt;
  const hitTime = fightTime() * ENEMY_KINDS[en.kind].fight;
  en.hitP = Math.min(1, fight.t / hitTime);
  if (fight.t >= hitTime) { en.hitP = 0; killSlime(en); fight = null; }
}

function killSlime(en) {
  enemies.splice(enemies.indexOf(en), 1);
  // Leave the body lying on its side. It is no longer an enemy, so it can't be hit.
  en.group.traverse(c => { c.userData.enemy = null; });
  en.group.userData.enemy = null;
  const turn = en.group.rotation.y;
  en.group.scale.setScalar(en.base);
  en.group.rotation.set(0, turn, -Math.PI / 2);
  // A body killed in mid-air falls until it lands on a block
  const lift = 0.25 * en.base;
  const cy = Math.floor(en.y - 0.1); // the block the body would lie on
  const onBlock = solid(get(Math.floor(en.x), cy, Math.floor(en.z)));
  // A body on a block is set exactly on top of that block. An enemy's height is a fraction
  // (it stops mid-air-gravity), so using it directly left the body hovering.
  const startY = onBlock ? cy + 1 + lift : en.y + lift;
  en.group.position.set(en.x, startY, en.z);
  corpses.push({ group: en.group, kind: en.kind, t: 0, x: en.x, z: en.z, vy: 0, lift, landed: onBlock, restY: startY });
  const k = ENEMY_KINDS[en.kind];
  for (let i = 0; i < k.gems; i++) addItem('gem');
  gain('fight', 2);
  logEvent('enemy_defeated', en.kind);
  say(k.name + ' defeated! +' + k.gems + ' gem' + (k.gems > 1 ? 's' : ''), 1500);
}

// ---- Pointer: hold to dig or fight, tap to build, drag to turn the world ----
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let digging = null; // {x, y, z, t}
let camYaw = 0;      // camera angle around the character
let headTarget = 0, headYaw = 0;
let press = null;        // {id, x, lastX, moved}
let pendingPlace = null; // cell to build in, used only if the press was a tap

// Which block or slime the press landed on, and the cell it would dig or build in
function aim(e) {
  ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...solidMeshes(), ...enemies.map(en => en.group)], true)[0];
  if (!hit) return null;
  const enemy = hit.object.userData.enemy || null;
  const d = ray.ray.direction, p = hit.point, e2 = 0.01;
  const dig = [Math.floor(p.x + d.x * e2), Math.floor(p.y + d.y * e2), Math.floor(p.z + d.z * e2)];
  // Reach is measured from the character, not the camera (the camera is far behind)
  const dist = Math.hypot(dig[0] + 0.5 - px, dig[1] + 0.5 - (py + HH / 2), dig[2] + 0.5 - pz);
  return {
    enemy, dist, dig,
    place: [Math.floor(p.x - d.x * e2), Math.floor(p.y - d.y * e2), Math.floor(p.z - d.z * e2)]
  };
}

// Zoom: mouse wheel, or pinch with two fingers
const canvas = renderer.domElement;
let zoom = 1;
function setZoom(z) { zoom = Math.min(5, Math.max(0.25, z)); }
const touches = new Map();
let pinchDist = 0;
canvas.addEventListener('pointerdown', e => touches.set(e.pointerId, { x: e.clientX, y: e.clientY }));
canvas.addEventListener('pointermove', e => {
  headTarget = (e.clientX / window.innerWidth * 2 - 1) * 0.8;
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (press && press.id === e.pointerId && touches.size === 1) {
    if (!press.moved && Math.abs(e.clientX - press.x) > 8) { press.moved = true; digging = null; fight = null; }
    if (press.moved) camYaw -= (e.clientX - press.lastX) * 0.01;
    press.lastX = e.clientX;
  }
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) setZoom(zoom * pinchDist / d);
    pinchDist = d;
    digging = null;
  }
});
function endTouch(e) {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinchDist = 0;
}
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  setZoom(zoom * (1 + e.deltaY * 0.001));
}, { passive: false });

// Right-click: build with a block from the quick bar, even when another slot is selected.
// Uses the selected slot if it holds a block, otherwise the first block slot with stock.
canvas.addEventListener('contextmenu', e => e.preventDefault());
function blockFromQuickBar() {
  const isBlock = id => id && ITEMS[id] && ITEMS[id].kind === 'block' && inv[id] > 0;
  if (isBlock(held())) return held();
  return qb.find(isBlock) || null;
}

canvas.addEventListener('pointerdown', e => {
  if (e.button === 2) {
    const a = aim(e);
    if (!a || a.enemy) return;
    if (a.dist > REACH) { say('Too far away! Get closer.'); return; }
    const id = blockFromQuickBar();
    if (!id) { say('Put a block in a quick bar slot first.', 2000); return; }
    placeCell(...a.place, id);
    return;
  }
  if (touches.size > 1) return; // two fingers = pinch
  press = { id: e.pointerId, x: e.clientX, lastX: e.clientX, moved: false };
  pendingPlace = null;
  const a = aim(e);
  if (!a) return;
  if (a.enemy) {
    if (Math.hypot(a.enemy.x - px, a.enemy.y - py, a.enemy.z - pz) > REACH + 1) { say('Too far away! Get closer.'); return; }
    if (held() !== 'sword') { say('Select the sword in the quick bar (1-6) to fight.', 2000); return; }
    fight = { e: a.enemy, t: 0 };
    digging = null;
    return;
  }
  if (a.dist > REACH) { say('Too far away! Get closer.'); return; }
  const [dx, dy, dz] = a.dig;
  if (solid(get(dx, dy, dz))) {
    if (held() !== 'pick') { say('Select the pickaxe in the quick bar (1-6) to dig.', 2000); return; }
    digging = { x: dx, y: dy, z: dz, t: 0 };
    armSwing = 0;
  } else {
    pendingPlace = a.place; // build on release, so a drag does not build
  }
});
canvas.addEventListener('pointerup', e => {
  if (press && press.id === e.pointerId && !press.moved && pendingPlace) placeCell(...pendingPlace);
  pendingPlace = null;
  press = null;
  digging = null;
  fight = null;
});

// Keep digging progress in step with the held block; cancel if we walk away
function updateDig(dt) {
  if (!digging) { crack.visible = false; return; }
  const { x, y, z } = digging;
  const dist = Math.hypot(x + 0.5 - px, y + 0.5 - (py + HH / 2), z + 0.5 - pz);
  if (!solid(get(x, y, z)) || dist > REACH + 1) { digging = null; crack.visible = false; return; }
  digging.t += dt;
  const progress = Math.min(1, digging.t / digTime());
  crack.visible = true;
  crack.position.set(x + 0.5, y + 0.5, z + 0.5);
  crack.material.opacity = progress * 0.6;
  if (progress >= 1) {
    const done = digCell(x, y, z);
    digging = null;
    crack.visible = false;
    if (!done) press = null;
  }
}

// ---- Game loop ----
function update(dt) {
  const k = c => !!keys[c];
  const sx = ((k('KeyD') || k('ArrowRight') || touch.R) ? 1 : 0) - ((k('KeyA') || k('ArrowLeft') || touch.L) ? 1 : 0);
  const sz = ((k('KeyS') || k('ArrowDown') || touch.B) ? 1 : 0) - ((k('KeyW') || k('ArrowUp') || touch.F) ? 1 : 0);
  const norm = Math.hypot(sx, sz) || 1;
  // Move relative to the camera, so "up" is always away from you on screen
  const cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
  const wx = sx * cosY + sz * sinY, wz = -sx * sinY + sz * cosY;
  vx = wx * SPEED / norm;
  vz = wz * SPEED / norm;

  const nx = px + vx * dt;
  if (!hits(nx, py, pz)) px = nx;
  const nz = pz + vz * dt;
  if (!hits(px, py, nz)) pz = nz;

  const jd = k('Space') || touch.J;
  if (jd && !jumpHeld && onGround) { vy = JUMP; onGround = false; squash = 1; }
  jumpHeld = jd;
  vy = Math.max(vy - GRAV * dt, -30);
  const ny = py + vy * dt;
  if (!hits(px, ny, pz)) { py = ny; onGround = false; }
  else { if (vy < 0) { onGround = true; squash = 1; } vy = 0; }

  if (py < -10) { [px, py, pz] = topSpawnPoint(); vy = 0; }

  // Inventory power grows while the bag is full
  if (invTotal() >= invCap()) {
    invTimer += dt;
    if (invTimer >= 1) { invTimer -= 1; gain('inv', 1); }
  } else invTimer = 0;

  updateDig(dt);
  updateFight(dt);
  updateSlimes(dt);
  updateTeleport(dt);
  updateSpawns(dt);
  updateDrops(performance.now() / 1000);

  const moving = sx || sz;
  if (moving) avatar.rotation.y = Math.atan2(vx, vz);
  headYaw += (headTarget - headYaw) * 0.15;
  headGroup.rotation.y = headYaw;

  walkT += dt * (moving && onGround ? 9 : 0);
  const swing = Math.sin(walkT) * 0.8;
  legL.rotation.x = swing;
  legR.rotation.x = -swing;
  armL.rotation.x = onGround ? -swing : -2.4;
  if (fight) armL.rotation.x = -1.3 + Math.sin(performance.now() / 110) * 0.8;
  if (digging) {
    armR.rotation.x = -1.3 + Math.sin(performance.now() / 110) * 0.7;
  } else if (armSwing > 0) {
    armSwing -= dt;
    armR.rotation.x = -1.2;
  } else {
    armR.rotation.x = onGround ? swing : -2.4;
  }

  squash = Math.max(0, squash - dt * 4);
  const sq = squash * 0.2;
  avatar.position.set(px, py, pz);
  avatar.scale.set(1 + sq, 1 - sq, 1 + sq);

  // Camera follows from behind, turned by camYaw, and zoomed by zoom
  const camX = px + Math.sin(camYaw) * 9 * zoom, camZ = pz + Math.cos(camYaw) * 9 * zoom;
  camera.position.lerp(new THREE.Vector3(camX, py + 5 * zoom, camZ), 0.12);
  camera.lookAt(px, py + 1, pz);

  const head = get(Math.floor(px), Math.floor(py + HH), Math.floor(pz));
  const under = solid(head);
  scene.background.setHex(under ? 0x2b2238 : head === T.WATER ? 0x3d7fb0 : 0x87ceeb);
  skyGroup.visible = !under;

  if (msgT > 0) { msgT -= dt * 1000; if (msgT <= 0) msgEl.textContent = ''; }
  drawHud();
}

const hud = document.getElementById('hud');
function drawHud() {
  const cap = invCap(), total = invTotal();
  const bar = (k, ratio) => `<div class="bar"><div style="width:${Math.min(1, ratio) * 100}%;background:${BAR[k]}"></div></div>`;
  hud.innerHTML =
    `${playerName}<br>` +
    `Digging Lv ${pw.dig.lvl}${bar('dig', pw.dig.xp / need(pw.dig.lvl))}` +
    `Building Lv ${pw.build.lvl}${bar('build', pw.build.xp / need(pw.build.lvl))}` +
    `Inventory Lv ${pw.inv.lvl}${bar('inv', total / cap)}` +
    `Fighting Lv ${pw.fight.lvl}${bar('fight', pw.fight.xp / need(pw.fight.lvl))}` +
    `Bag ${total}/${cap} &nbsp; Gems ${inv.gem}<br>` +
    `World ${esc(worldId || 'alone')}` + (others.size ? ' &middot; With: ' + [...others.values()].map(o => esc(o.name)).join(', ') : '');
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);

  updateOthers(dt);
  try { updateView(); } catch (e) { logError(e, 'rebuild'); }

  updateSky(dt);

}

const iconCache = {};
function itemIcon(id) {
  if (iconCache[id]) return iconCache[id];
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const g = c.getContext('2d');
  const box = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  if (id === 'dirt') {
    box(0, 0, 32, 32, '#8d5524');
    for (const [x, y] of [[4, 6], [18, 4], [10, 16], [24, 18], [6, 24], [20, 27]]) box(x, y, 3, 3, '#6b3e18');
    box(12, 10, 2, 2, '#a86b35'); box(26, 10, 2, 2, '#a86b35');
  } else if (id === 'stone') {
    box(0, 0, 32, 32, '#7a7a7a'); box(0, 0, 32, 3, '#9a9a9a'); box(0, 29, 32, 3, '#5a5a5a');
    g.strokeStyle = '#4a4a4a'; g.lineWidth = 2; g.beginPath();
    g.moveTo(6, 8); g.lineTo(14, 16); g.lineTo(10, 24); g.moveTo(20, 6); g.lineTo(26, 14); g.stroke();
  } else if (id === 'gem') {
    g.fillStyle = '#29d3ff'; g.beginPath(); g.moveTo(16, 3); g.lineTo(28, 12); g.lineTo(16, 29); g.lineTo(4, 12); g.closePath(); g.fill();
    g.fillStyle = '#1a8fb8'; g.beginPath(); g.moveTo(4, 12); g.lineTo(16, 12); g.lineTo(16, 29); g.closePath(); g.fill();
    g.fillStyle = '#bff3ff'; g.beginPath(); g.moveTo(16, 3); g.lineTo(22, 12); g.lineTo(10, 12); g.closePath(); g.fill();
  } else if (id === 'pick') {
    g.lineCap = 'round';
    g.strokeStyle = '#8b5a2b'; g.lineWidth = 4; g.beginPath(); g.moveTo(8, 27); g.lineTo(22, 11); g.stroke();
    g.strokeStyle = '#9e9e9e'; g.lineWidth = 4; g.beginPath(); g.moveTo(3, 13); g.quadraticCurveTo(16, 2, 29, 13); g.stroke();
  } else if (id === 'sword') {
    g.save(); g.translate(16, 16); g.rotate(Math.PI / 4);
    box(-2, -14, 4, 19, '#dfe6ee'); box(-1, -14, 1, 19, '#ffffff');
    box(-6, 5, 12, 3, '#d4a017');
    box(-1.5, 8, 3, 8, '#8b5a2b');
    box(-2, 16, 4, 3, '#d4a017');
    g.restore();
  } else {
    box(0, 0, 32, 32, '#888888');
  }
  iconCache[id] = c.toDataURL();
  return iconCache[id];
}

const RACE = {

}
function applyLook() { paint(avatar, lookOf(profile)); }

// Snapshot of the character, used to build the other players
pickGroup.name = 'pick'; swordGroup.name = 'sword'; heldCube.name = 'held';
legL.name = 'legL'; legR.name = 'legR';
const TEMPLATE = avatar.clone(true);

// ---- Other players in the same world ----
const others = new Map(); // player id -> { g, name, x, y, z, yaw, legL, legR, walk }
function nameTag(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, 256, 64);
  g.fillStyle = '#fff'; g.font = 'bold 28px sans-serif'; g.textAlign = 'center';
  g.fillText(String(text).slice(0, 20), 128, 42);
  const t = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  s.scale.set(1.6, 0.4, 1);
  s.position.y = 2.2;
  return s;
}
function makeOther(id, meta) {
  const g = TEMPLATE.clone(true);
  g.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  for (const n of ['pick', 'sword', 'held']) { const x = g.getObjectByName(n); if (x) x.visible = false; }
  paint(g, lookOf(meta));
  g.add(nameTag(meta.name));
  scene.add(g);
  return { g, name: meta.name, x: meta.x, y: meta.y, z: meta.z, yaw: meta.yaw, legL: g.getObjectByName('legL'), legR: g.getObjectByName('legR'), walk: 0 };
}
function updateOthers(dt) {
  for (const o of others.values()) {
    const p = o.g.position;
    const dx = o.x - p.x, dy = o.y - p.y, dz = o.z - p.z;
    if (Math.hypot(dx, dy, dz) > 10) { p.set(o.x, o.y, o.z); }   // jumped far: snap
    else { p.x += dx * 0.25; p.y += dy * 0.25; p.z += dz * 0.25; }
    const moving = Math.hypot(dx, dz) > 0.02;
    o.walk += dt * (moving ? 9 : 0);
    const sw = Math.sin(o.walk) * 0.8;
    if (o.legL) o.legL.rotation.x = sw;
    if (o.legR) o.legR.rotation.x = -sw;
    o.g.rotation.y = o.yaw;
  }
}
function myMeta() {
  return { name: playerName, race: profile && profile.race, sex: profile && profile.sex, x: px, y: py, z: pz, yaw: avatar.rotation.y };
}
function onPresence() {
  if (!channel) return;
  const st = channel.presenceState();
  const seen = new Set();
  for (const key of Object.keys(st)) {
    if (key === pid) continue;
    const metas = st[key];
    const m = metas && metas[metas.length - 1];
    if (!m) continue;
    seen.add(key);
    let o = others.get(key);
    if (!o) { o = makeOther(key, m); others.set(key, o); }
    Object.assign(o, { name: m.name, x: m.x, y: m.y, z: m.z, yaw: m.yaw });
  }
  for (const [key, o] of others) if (!seen.has(key)) { scene.remove(o.g); others.delete(key); }
}

// ---- Shared world: block changes are sent live and saved every few seconds ----
function shareBlock(x, y, z, t) {
  worldDirty = true;
  if (channel && channelJoined) Promise.resolve(channel.send({ type: 'broadcast', event: 'block', payload: { x, y, z, t } })).catch(() => {});
}
function connectWorld() {
  if (!sb || !worldId) return;
  if (channel) { try { sb.removeChannel(channel); } catch (e) {} channel = null; channelJoined = false; }
  for (const o of others.values()) scene.remove(o.g);
  others.clear();
  const ch = sb.channel('world-' + worldId, { config: { presence: { key: pid }, broadcast: { self: false } } });
  ch.on('broadcast', { event: 'block' }, ({ payload }) => {
    const p = payload || {};
    if (!inBounds(p.x, p.y, p.z) || !Number.isInteger(p.t) || p.t < 0 || p.t > 4) return;
    setBlock(p.x, p.y, p.z, p.t);
  });
  ch.on('presence', { event: 'sync' }, onPresence);
  ch.subscribe(status => {
    if (status === 'SUBSCRIBED') { channelJoined = true; Promise.resolve(ch.track(myMeta())).catch(() => {}); }
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { channelJoined = false; logError(status, 'realtime'); }
  });
  channel = ch;
}
setInterval(() => {
  if (channel && channelJoined && profile) Promise.resolve(channel.track(myMeta())).catch(() => {});
}, 200);
setInterval(async () => {
  if (!sb || !worldId || !worldDirty) return;
  worldDirty = false;
  const stamp = new Date().toISOString();
  const { error } = await sb.from('worlds').upsert({ id: worldId, grid: JSON.stringify(encodeWorld()), updated_at: stamp });
  if (error) worldDirty = true; else lastStamp = stamp;
}, 4000);
setInterval(async () => {
  if (!sb || !worldId || worldDirty) return;
  const { data } = await sb.from('worlds').select('grid,updated_at').eq('id', worldId).maybeSingle();
  if (data && data.grid && data.updated_at !== lastStamp) { lastStamp = data.updated_at; loadShared(data.grid, worldId); dirty = true; }
}, 30000);

async function joinExisting(code) {
  await sbReady;
  if (!sb) throw new Error('offline');
  const { data, error } = await sb.from('worlds').select('grid,updated_at').eq('id', code).maybeSingle();
  if (error) throw error;
  if (!data) return false;
  if (data.grid) { loadShared(data.grid, code); dirty = true; }
  lastStamp = data.updated_at;
  worldId = code;
  return true;
}
async function createWorld() {
  await sbReady;
  if (!sb) throw new Error('offline');
  const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  for (let i = 0; i < 8; i++) {
    let code = '';
    for (let k = 0; k < 4; k++) code += ALPH[Math.floor(Math.random() * ALPH.length)];
    const { error } = await sb.from('worlds').insert({ id: code, grid: JSON.stringify(encodeWorld()) });
    if (!error) { worldId = code; lastStamp = null; return code; }
  }
  throw new Error('Could not make a world code. Try again.');
}
async function resumeWorld(id) {
  try {
    await sbReady;
    if (!sb) return;
    const ok = await joinExisting(id);
    if (ok) { connectWorld(); logEvent('world_joined', 'resume'); }
    else { worldId = null; say('That world is gone. Start a new world from the Bag.', 5000); }
  } catch (e) { logError(e, 'resume'); }
}

// ---- Start wizard: sex, race, name, then new or joined world ----
const wiz = { step: 0, sex: null, race: null, name: '', mode: 'new', code: '' };
const wizEl = document.getElementById('wiz');
const wizBody = document.getElementById('wizBody');
const wizNext = document.getElementById('wizNext');
const wizBack = document.getElementById('wizBack');
const wizErr = document.getElementById('wizErr');
function makeName() { return pick(titles) + ' ' + pick(names) + ' ' + (Math.floor(Math.random() * 999) + 1); }
function opts(key, list, cur) {
  return '<div class="opts">' + list.map(([v, l]) => `<button class="opt${cur === v ? ' on' : ''}" data-${key}="${v}">${l}</button>`).join('') + '</div>';
}
function wizRender() {
  wizErr.textContent = '';
  wizBack.style.visibility = wiz.step > 0 ? 'visible' : 'hidden';
  let html = '', ok = true;
  if (wiz.step === 0) {
    html = '<h2>Welcome!</h2><p>Who is playing?</p>' + opts('sex', [['boy', 'Boy'], ['girl', 'Girl']], wiz.sex);
    ok = !!wiz.sex;
  } else if (wiz.step === 1) {
    html = '<h2>Pick your people</h2>' + opts('race', [['human', 'Human'], ['elf', 'Elf'], ['dwarf', 'Dwarf']], wiz.race);
    ok = !!wiz.race;
  } else if (wiz.step === 2) {
    html = '<h2>Your name</h2><p>Names are picked for you, so nobody needs to type one.</p><div class="name">' + esc(wiz.name) + '</div><button class="opt" data-shuffle="1">Shuffle name</button>';
  } else {
    html = '<h2>Your world</h2>' + opts('mode', [['new', 'Start a new world'], ['join', "Join a friend's world"]], wiz.mode) +
      (wiz.mode === 'join' ? '<p>Type the 4-letter world code:</p><input id="wizCode" maxlength="4" autocomplete="off" value="' + esc(wiz.code) + '">' : '');
    ok = wiz.mode === 'new' || wiz.code.length === 4;
  }
  wizBody.innerHTML = html;
  wizNext.textContent = wiz.step === 3 ? 'Start playing' : 'Next';
  wizNext.disabled = !ok;
}
wizBody.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.sex) wiz.sex = b.dataset.sex;
  else if (b.dataset.race) wiz.race = b.dataset.race;
  else if (b.dataset.mode) wiz.mode = b.dataset.mode;
  else if (b.dataset.shuffle) wiz.name = makeName();
  else return;
  wizRender();
});
wizBody.addEventListener('input', e => {
  if (e.target.id !== 'wizCode') return;
  wiz.code = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  e.target.value = wiz.code;
  wizNext.disabled = !(wiz.mode === 'new' || wiz.code.length === 4);
});
wizBack.addEventListener('click', () => { if (wiz.step > 0) { wiz.step--; wizRender(); } });
wizNext.addEventListener('click', () => { if (wiz.step < 3) { wiz.step++; wizRender(); } else finishWizard(); });

function openWizard() {
  paused = true;
  wiz.step = 0;
  wiz.sex = (profile && profile.sex) || null;
  wiz.race = (profile && profile.race) || null;
  wiz.name = playerName || makeName();
  wiz.mode = 'new';
  wiz.code = '';
  wizEl.classList.remove('hide');
  wizRender();
}
async function finishWizard() {
  const slot = activeSlot !== null ? activeSlot : freeSlot();
  if (slot === null) { wizErr.textContent = 'You already have 100 saved games. Delete one the next time you open the game, then start a new one.'; return; }
  wizNext.disabled = true;
  wizErr.textContent = 'Setting up your world...';
  try {
    await sbReady;
    if (wiz.mode === 'new') await createWorld();
    else {
      const found = await joinExisting(wiz.code);
      if (!found) throw new Error('No world has that code. Check it with your friend.');
    }
  } catch (err) {
    wizErr.textContent = err.message === 'offline' ? "Can't reach the server right now. Try again in a moment." : err.message;
    wizNext.disabled = false;
    logError(err, 'wizard');
    return;
  }
  activeSlot = slot;
  setChoice(slot);
  profile = { sex: wiz.sex, race: wiz.race };
  playerName = wiz.name;
  applyLook();
  connectWorld();
  logEvent('game_started', wiz.mode);
  wizEl.classList.add('hide');
  paused = false;
  saveGame();
  say('Welcome, ' + playerName + '! World code: ' + worldId, 6000);
}

// ---- Saved games menu: pick one of your saved games, delete one, or start a new game ----
function hideSlotMenu() { document.getElementById('slots').classList.add('hide'); }
function renderSlotMenu() {
  const list = listSlots();
  document.getElementById('slotsBody').innerHTML = '<h2>Your games</h2>' +
    (list.length ? '<p>Pick a saved game to carry on.</p>' : '<p>No saved games on this device yet.</p>') +
    list.map(({ n, d }) =>
      `<div class="savecard"><span class="sv-name">${esc(d.name || 'Adventurer')}</span>` +
      `<span class="sv-meta">World ${esc(d.worldId || '?')} · ${d.at ? 'last played ' + esc(new Date(d.at).toLocaleString()) : 'saved on this device'}</span>` +
      `<div class="sv-acts"><button data-play="${n}">Play</button><button class="sv-del" data-del="${n}">Delete</button></div></div>`).join('') +
    `<div style="text-align:center;margin-top:12px"><button data-new="1" ${list.length >= SLOT_MAX ? 'disabled' : ''}>Start a new game</button></div>` +
    (list.length >= SLOT_MAX ? '<p>You have 100 saved games. Delete one to start another.</p>' : '');
}
function showSlotMenu() {
  paused = true;
  renderSlotMenu();
  document.getElementById('slots').classList.remove('hide');
}
document.getElementById('slotsBody').addEventListener('click', e => {
  const p = e.target.closest('[data-play]');
  if (p) { setChoice(p.dataset.play); location.reload(); return; }
  const d = e.target.closest('[data-del]');
  if (d) {
    if (!confirm('Delete this saved game? It cannot be undone.')) return;
    try { localStorage.removeItem(slotKey(+d.dataset.del)); } catch (err) {}
    if (listSlots().length) renderSlotMenu();
    else { hideSlotMenu(); openWizard(); }
    return;
  }
  if (e.target.closest('[data-new]') && listSlots().length < SLOT_MAX) {
    setChoice('new');
    hideSlotMenu();
    openWizard();
  }
});

// ---- Startup ----
applyLook();
logEvent('session_start', VERSION);
logEvent('world_loaded', worldSource + ' seed ' + seed);
if (activeSlot === null && getChoice() !== 'new' && listSlots().length) showSlotMenu();
else if (profile && worldId) { paused = false; resumeWorld(worldId); }
else openWizard();

setInterval(saveGame, 5000);
addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

updateView(300);
dirty = false;
updateHand();
renderUI();
requestAnimationFrame(frame);
// Read-only status for the automated browser test (scripts/tests/browser.test.mjs). Changes nothing.
window.gameProbe = () => ({ enemies: enemies.length, px, py, pz, drawn: lastDrawn, rebuildMs: lastRebuildMs, version: VERSION,
  list: enemies.map(e => ({ kind: e.kind, x: e.x, y: e.y, z: e.z, airT: e.airT || 0 })) });
</script>
</body>
